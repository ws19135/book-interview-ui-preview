<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>新書訪談邀約｜情境操作體驗</title>
<style>
/* ══════════════════════════════════════════════════════════════
   色彩取自實機（DESIGN.md Report 模式 · ②知性編輯）。
   字級為本輪重訂：⭐ 所有看得到的字一律 ≥ 13px，全部走 token。
   ⛔ 不引入任何外部資源：無 CDN、無字型 CDN、無追蹤碼。
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme: light;
  --bg:#ECE6DB; --card:#F5F1E8; --ink:#1A1A1A;
  --body:#5A5A5A; --taupe:#7A736A; --line:#B8B0A4;
  --accent:#B5451F;
  --serif:'Noto Serif TC','Songti TC',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;

  --font-xs: 13px;
  --font-sm: 14px;
  --font-base: 15px;
  --font-md: 16px;
  --font-lg: 18px;
  --font-xl: 22px;
  --font-display: 28px;
}
*{box-sizing:border-box}
/* ⚠️ .modes 用 display:flex，會蓋掉瀏覽器預設的 [hidden]{display:none}——
      沒有這一行，落地頁上模式列還看得到，同事沒點入口就能跳過去（實測當場踩到）。 */
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--serif);font-size:var(--font-base);line-height:1.8}

.banner{position:sticky;top:0;z-index:50;background:var(--accent);color:#FFF8F2;
  font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.06em;
  padding:9px 16px;text-align:center}
.banner b{font-weight:600}

.disclose{margin:0;padding:10px 16px;text-align:center;background:var(--card);
  border-bottom:1px solid var(--line);font-family:var(--sans);
  font-size:var(--font-xs);color:var(--body)}
.wrap{max-width:940px;margin:0 auto;padding:26px 20px 96px}
#stage{scroll-margin-top:56px}

.eyebrow{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.2em;
  color:var(--taupe);margin:0}
h1{font-size:var(--font-display);font-weight:700;margin:6px 0 4px;
  letter-spacing:.01em;line-height:1.35;text-wrap:balance}
h2{font-size:var(--font-lg);font-weight:700;margin:28px 0 10px;text-wrap:balance}
h3{font-family:var(--sans);font-size:var(--font-xs);font-weight:600;letter-spacing:.08em;
  color:var(--taupe);margin:24px 0 8px}
.sub{font-size:var(--font-md);color:var(--body);margin:0 0 22px}
.rule{border:0;border-top:1px solid var(--line);margin:22px 0}
p{margin:0 0 10px}

/* ── 開場 ── */
.hero{border:1px solid var(--line);background:var(--card);padding:32px 28px;margin:0 0 20px}
.hero h2{font-size:var(--font-xl);margin:0 0 14px}
.hero p{font-size:var(--font-md);margin:0 0 12px}
.hero .who{border-top:1px solid var(--line);margin:18px 0 0;padding:16px 0 0}
.hero .who dt{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);
  letter-spacing:.05em;margin:0 0 2px}
.hero .who dd{margin:0 0 12px;font-size:var(--font-base)}

/* ── 功能入口示意 ── */
.entrynote{font-family:var(--sans);font-size:var(--font-sm);color:var(--taupe);margin:0 0 18px}
.tile{display:block;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--card);padding:22px 24px;margin:0 0 14px;
  font-family:inherit;color:inherit}
.tile:hover,.tile:focus-visible{border-color:var(--ink)}
.tile .tn{font-size:var(--font-lg);font-weight:700;margin:0 0 6px}
.tile .td{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);margin:0}
.tile .tgo{font-family:var(--sans);font-size:var(--font-xs);color:var(--accent);margin:12px 0 0}

/* ── 模式列 ── */
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px;align-items:center}
.modes button{font-family:var(--sans);font-size:var(--font-sm);padding:9px 16px;cursor:pointer;
  background:transparent;border:1px solid var(--line);color:var(--body)}
.modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);
  color:var(--card);font-weight:600}
.modehint{font-family:var(--sans);font-size:var(--font-sm);color:var(--taupe);margin:0 0 20px}

/* ── 步驟軌 ── */
.rail{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;margin:0 0 18px;
  border-bottom:1px solid var(--line)}
.rail button{flex:none;font-family:var(--sans);font-size:var(--font-xs);padding:7px 12px;
  cursor:pointer;background:var(--card);border:1px solid var(--line);
  color:var(--body);white-space:nowrap}
.rail button[aria-current="step"]{background:var(--ink);border-color:var(--ink);
  color:var(--card);font-weight:600}
.rail button.done{border-color:var(--ink);color:var(--ink)}

.storycard{border:1px solid var(--line);background:var(--card);padding:20px 22px;margin:0 0 18px}
.storycard .step{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.1em;
  color:var(--taupe);margin:0 0 6px}
.storycard h2{font-size:var(--font-xl);margin:0 0 12px}
.storycard p{font-size:var(--font-md);color:var(--ink);margin:0 0 10px}
.storycard .todo{margin:14px 0 0;padding:14px 0 0;border-top:1px solid var(--line)}
.storycard .todo .t{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.1em;
  color:var(--taupe);margin:0 0 8px}
.storycard ol{margin:0;padding-left:22px;font-size:var(--font-base)}
.storycard ol li{margin:0 0 6px}
.storycard .watch{font-family:var(--sans);font-size:var(--font-sm);color:var(--accent);margin:12px 0 0}
.stepnav{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:16px 0 0;
  border-top:1px solid var(--line)}
.stepnav .spacer{flex:1}

/* ── 系統導覽 ── */
nav{display:flex;flex-wrap:wrap;gap:20px;margin:0 0 6px;
  border-bottom:1px solid var(--line);padding-bottom:10px}
nav button{background:none;border:0;padding:0 0 4px;cursor:pointer;
  font-family:var(--serif);font-size:var(--font-base);color:var(--body);
  border-bottom:1px solid transparent}
nav button:hover,nav button:focus-visible{color:var(--ink);border-bottom-color:var(--line)}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.navnote{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);margin:8px 0 20px}
.crumb{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);margin:0 0 14px}
.crumb button{background:none;border:0;padding:0;cursor:pointer;font:inherit;
  color:var(--body);text-decoration:underline;text-underline-offset:3px}
.crumb span{margin:0 8px}

/* ── 表格 ── */
.tablewrap{overflow-x:auto;margin:0 0 12px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:var(--font-sm);
  font-variant-numeric:tabular-nums;min-width:560px}
th{font-family:var(--sans);font-size:var(--font-xs);font-weight:600;letter-spacing:.06em;
  color:var(--taupe);text-align:left;padding:10px 11px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px;border-bottom:1px solid rgba(184,176,164,.45);vertical-align:top}
tr:last-child td{border-bottom:0}
.empty{padding:20px 11px;color:var(--taupe);font-family:var(--sans);font-size:var(--font-sm)}
tr.spot td{background:rgba(181,69,31,.055)}

.figs{display:flex;flex-wrap:wrap;gap:0;margin:6px 0 18px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fig{flex:1;min-width:160px;padding:16px 20px 16px 0}
.fig .n{font-family:Georgia,'Songti TC',serif;font-size:var(--font-xl);color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.3}
.fig .l{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.05em;
  color:var(--taupe);margin-top:2px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;margin:0 0 16px;
  font-size:var(--font-base)}
.kv dt{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.05em;
  color:var(--taupe);padding-top:3px}
.kv dd{margin:0}

.actions{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0 4px}
button.act{font-family:var(--sans);font-size:var(--font-sm);padding:9px 16px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--ink)}
button.act:hover,button.act:focus-visible{border-color:var(--ink)}
button.act.risk{border-color:var(--accent);color:var(--accent)}
button.act.go{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
button.act:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans);
  font-size:var(--font-sm);color:var(--accent);text-decoration:underline;text-underline-offset:3px}
button.link.q{color:var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{border:1px solid var(--line);background:var(--card);padding:18px;margin:12px 0 14px}
.panel .note{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);margin:0 0 14px}
.panel label{display:block;font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.04em;
  color:var(--taupe);margin:12px 0 4px}
.panel input[type=text],.panel select,.panel textarea{width:100%;font-family:var(--sans);
  font-size:var(--font-md);padding:9px 11px;border:1px solid var(--line);
  background:#FFFDF9;color:var(--ink)}
.panel textarea{min-height:72px;resize:vertical}
.panel .chk{display:flex;gap:9px;align-items:flex-start;margin:14px 0 2px;
  font-family:var(--sans);font-size:var(--font-sm);color:var(--ink)}
.panel .chk input{margin-top:4px;flex:none;width:16px;height:16px}

.msg{font-family:var(--sans);font-size:var(--font-sm);padding:12px 15px;margin:14px 0;
  border:1px solid var(--line);background:var(--card)}
.msg.ok{border-color:var(--ink)}
.msg.bad{border-color:var(--accent);color:var(--accent)}
.msg.bad .d{color:var(--accent)}
.msg .t{font-weight:600}
.msg .d{color:var(--body);margin-top:3px}
.msg ul{margin:8px 0 0;padding-left:20px}
.msg li{margin:0 0 4px}

.note{font-family:var(--sans);font-size:var(--font-sm);color:var(--taupe);margin:10px 0 16px}
.mask{font-family:var(--sans);letter-spacing:.14em;color:var(--taupe)}
.denied{border:1px solid var(--line);background:var(--card);padding:40px 22px;
  text-align:center;margin:16px 0}
.denied p{margin:0 0 8px;font-size:var(--font-lg)}
.denied .d{font-family:var(--sans);font-size:var(--font-sm);color:var(--body)}

.chip{display:inline-block;font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.03em;
  padding:3px 9px;border:1px solid var(--line);color:var(--body);
  white-space:nowrap;background:rgba(255,253,249,.6)}
.chip.yes{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip.part{border-color:var(--body);color:var(--body)}
.chip.soon{border-style:dashed;color:var(--taupe)}
.chip.no{border-style:dashed;color:var(--taupe);opacity:.8}
.chip.watch{border-color:var(--accent);color:var(--accent)}

.legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:12px 0 24px;padding:16px;
  border:1px solid var(--line);background:var(--card)}
.legend div{font-family:var(--sans);font-size:var(--font-sm);color:var(--body)}
.flow{display:grid;gap:0;margin:0 0 26px}
.stage{border:1px solid var(--line);background:var(--card);padding:15px 17px}
.stage .hd{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.stage .nm{font-weight:700;font-size:var(--font-md)}
.stage .idx{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);letter-spacing:.08em}
.stage .desc{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);margin:8px 0 0}
.stage .states{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.arrow{text-align:center;color:var(--line);font-size:var(--font-lg);line-height:1;margin:6px 0}

.fb{border:1px solid var(--line);background:var(--card);padding:20px;margin:24px 0 0}
.fb .grid{display:grid;gap:14px}
.fb label{display:block;font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.04em;
  color:var(--taupe);margin:0 0 4px}
/* ⚠️ 輸入框一律 16px：iOS 上小於 16px 會在點進欄位時自動放大整頁，很難用。 */
.fb select,.fb textarea,.fb input[type=text]{width:100%;font-family:var(--sans);
  font-size:var(--font-md);padding:9px 11px;border:1px solid var(--line);
  background:#FFFDF9;color:var(--ink)}
.fb textarea{min-height:64px;resize:vertical}
.fb .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fbnote{font-family:var(--sans);font-size:var(--font-sm);color:var(--accent);margin:14px 0 0;font-weight:600}
.fblist{margin:16px 0 0;font-family:var(--sans);font-size:var(--font-sm);color:var(--body)}
.fblist li{margin:0 0 5px}
.out{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:var(--font-xs);
  background:#FFFDF9;border:1px solid var(--line);padding:14px;max-height:280px;
  overflow:auto;margin:14px 0 0;line-height:1.6}

details.notes{border-top:1px solid var(--line);margin:32px 0 0;padding:18px 0 0}
details.notes summary{font-family:var(--sans);font-size:var(--font-sm);color:var(--taupe);
  cursor:pointer;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:'▸ ';color:var(--line)}
details.notes[open] summary::before{content:'▾ '}
details.notes .inner{margin:18px 0 0;font-family:var(--sans);font-size:var(--font-sm);color:var(--body)}
details.notes .inner h4{font-family:var(--sans);font-size:var(--font-sm);font-weight:600;
  color:var(--ink);margin:20px 0 6px}
details.notes .inner table{font-size:var(--font-xs);min-width:640px}
details.notes .inner ul{margin:0 0 10px;padding-left:20px}
details.notes .inner li{margin:0 0 4px}

@media (max-width:640px){
  .wrap{padding:20px 15px 88px}
  h1{font-size:var(--font-xl)}
  .hero{padding:22px 18px}
  .storycard{padding:16px}
  .storycard h2{font-size:var(--font-lg)}
  .fb .row2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dd{margin:0 0 10px}
  nav{gap:15px}
  .fig{min-width:130px;padding:14px 14px 14px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="banner">互動示意稿｜<b>全部為假資料</b>｜不連資料庫</div>
<p class="disclose">本案例中的人物、書名、出版社、節目與聯絡資料全部為虛構。</p>

<div class="wrap">
  <p class="eyebrow">SDH</p>
  <h1>新書訪談邀約｜情境操作體驗</h1>
  <p class="sub" id="lede"></p>

  <div class="modes" id="modes" hidden role="group" aria-label="檢視模式">
    <button id="mS" aria-pressed="true">情境式操作體驗</button>
    <button id="mF" aria-pressed="false">自由操作</button>
    <button id="mB" aria-pressed="false">整件事的全貌</button>
    <button class="act" id="btnReset" style="margin-left:auto">重新開始</button>
  </div>
  <p class="modehint" id="modehint" hidden></p>

  <hr class="rule">
  <div id="stage"></div>
  <section id="feedback" hidden></section>

  <details class="notes" id="notes">
    <summary>設計與驗證備註（給專案負責人看的技術細節，同事可以略過）</summary>
    <div class="inner" id="notesinner"></div>
  </details>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   硬規則
     1. ⛔ 完全沒有對外呼叫：沒有 Apps Script 遠端呼叫、沒有非同步請求、沒有長連線。
        ⚠️ 連這些名字的字面值都不出現在本檔。
     2. ⛔ 不連任何資料庫。狀態只在 DEMO 這個記憶體物件裡。
     3. 只有回饋會寫瀏覽器本機儲存，且永不上傳。
     4. 一律 textContent，⛔ 不用 innerHTML。
     5. ⭐ 主要操作流程裡不出現工程詞彙；技術細節一律收進頁尾摺疊區。
   ══════════════════════════════════════════════════════════════ */

/* 中文狀態名 —— 逐字取自實機的顯示標籤表 */
var L={
  DIRECTION:{AUTHOR_INITIATED:'作者端發起',PROGRAM_INITIATED:'節目端發起'},
  SR09:{RECEIVED:'已收件',UNDER_REVIEW:'審核中',SHORTLISTING:'名單研擬',
        AWAITING_REQUESTER:'待需求方確認',INVITING:'邀約中',IN_PROGRESS:'執行中',
        REQUEST_DECLINED:'婉拒需求',REQUEST_CANCELLED:'已取消',REQUEST_CLOSED:'已結案'},
  SR10:{AWAITING_OWNERSHIP:'待歸屬確認',PENDING_PITCH:'待提案',PITCHED:'已提案',
        NO_REPLY:'未回覆（追蹤中）',ACCEPTED:'已接受',REJECTED:'已婉拒',
        NO_RESPONSE:'無回覆結案',EXCLUDED:'已排除'},
  SR01:{ESTABLISHED:'已成立',ON_HOLD:'暫緩',CANCELLED:'取消',ABORTED:'中止',CLOSED:'結案'},
  SR02:{PENDING:'待決',ACCEPTED:'已接受',DECLINED:'婉拒',ON_HOLD:'暫緩'},
  SR05:{NOT_STARTED:'未開始',SCRIPT_READY:'訪綱就緒'},
  SR06:{UNSET:'未定',PROPOSED:'已提議',CONFIRMED:'已確認',RESCHEDULED:'已改期'},
  SR07:{NOT_STARTED:'未開始',OUTLINE_READY:'訪綱就緒',RECORDED:'已錄音',EDITED:'已剪輯',
        AWAITING_COUNTERPARTY:'待對方上架',PUBLISHED:'已上架',NOT_AIRED:'不予上架'},
  LINK_STATE:{ACTIVE:'有效',USED:'已完成確認',EXPIRED:'已過期',
              REVOKED:'已撤銷',SUPERSEDED:'已被新連結取代'},
  MATERIAL_KIND:{PHYSICAL_BOOK:'實體樣書',EBOOK_PDF:'電子書／PDF',COVER_VISUAL:'書封與視覺素材',
                 AUTHOR_BIO:'作者簡介與照片',PRESS_KIT:'新聞稿／書籍介紹',OTHER:'其他訪談資料'},
  NECESSITY:{REQUIRED:'必要',REFERENCE:'參考'},
  DELIVERY:{NOT_PROVIDED:'尚未提供',PROVIDED:'已提供',SHIPPED:'已寄出'},
  RECEIPT:{NOT_RECEIVED:'未收到',RECEIVED:'已收到',CONFIRMED:'已確認'},
  PRODUCER:{COMPANY:'公司製作',COUNTERPARTY:'對方製作'},
  INTAKE_CHANNEL:{PUBLIC_FORM:'對外表單',INTERNAL_PROXY:'內部代填'},
  DEAL_MODE:{RECIPROCAL:'互訪',ONE_WAY_FREE:'單向免費',PUBLISHER_PAID:'出版社付費'}
};
var MASK='***';
function lab(d,c){ var m=L[d]; return (m&&m[c])||c; }

/* ─────────── 這齣戲（全部虛構）─────────── */
var STORY={
  author:'林以安老師',
  book:'《在變動裡，找到自己的節奏》',
  publisher:'遠方學堂出版（虛構）',
  contact:'yian.lin@example.invalid',
  progA:'《慢慢說》', progB:'《上班的事》'
};

/* ─────────── Demo 狀態 ─────────── */
var SEED,DEMO;
function seed(){
  return {
    seq:{req:3,cand:0,cas:0,mat:0,per:3,act:0},
    intakeOpen:false, staleArmed:false, scenarioReq:'', scenarioCase:'',
    requests:[
      {id:'REQ-DEMO-001',direction:'AUTHOR_INITIATED',status:'RECEIVED',
       book:'《晚班的城市》',program:'',listV:0,v:1,name:'林晚晴',
       contact:'wan.ching@example.invalid',channel:'PUBLIC_FORM',
       window:'2026 年 11 月中下旬',expected:''},
      {id:'REQ-DEMO-002',direction:'PROGRAM_INITIATED',status:'SHORTLISTING',

function el(t,x,c){ var e=document.createElement(t);
  if(x!==null&&x!==undefined&&x!=='') e.textContent=x; if(c) e.className=c; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function btn(l,c,f){ var b=el('button',l,c); b.type='button'; b.onclick=f; return b; }
function chip(t,c){ return el('span',t,'chip '+(c||'')); }

function table(cols,rows,opts){
  var o=opts||{}, w=el('div',null,'tablewrap'), t=document.createElement('table');
  var th=document.createElement('thead'), hr=document.createElement('tr');
  cols.forEach(function(c){ hr.appendChild(el('th',c.label)); });
  if(o.rowActions) hr.appendChild(el('th','動作'));
  th.appendChild(hr); t.appendChild(th);
  var tb=document.createElement('tbody');
  if(!rows.length){
    var tr0=document.createElement('tr'), td0=document.createElement('td');
    td0.colSpan=cols.length+(o.rowActions?1:0);
    td0.appendChild(el('div',o.emptyText||'目前沒有資料。','empty'));
    tr0.appendChild(td0); tb.appendChild(tr0);
  }
  rows.forEach(function(r){
    var tr=document.createElement('tr');
    if(o.spot&&o.spot(r)) tr.className='spot';
    cols.forEach(function(c){
      var td=document.createElement('td');
      if(c.render) c.render(td,r);
      else{
        var v=r[c.key];
        if(v===MASK&&o.unmask&&o.unmask.indexOf(c.key)>=0){
          td.appendChild(el('span',MASK,'mask'));
          td.appendChild(document.createTextNode(' '));
          td.appendChild(btn('查看','link q',function(){ doUnmask(o.pkTable,r[o.pk],c.key); }));
        } else td.textContent=(v===''||v===undefined||v===null)?'—':String(v);
      }
      tr.appendChild(td);
    });
    if(o.rowActions){ var ta=document.createElement('td'); o.rowActions(ta,r); tr.appendChild(ta); }
    tb.appendChild(tr);
  });
  t.appendChild(tb); w.appendChild(t); return w;
}
function kv(pairs){
  var d=document.createElement('dl'); d.className='kv';
  pairs.forEach(function(p){ d.appendChild(el('dt',p[0]));
    d.appendChild(el('dd',(p[1]===''||p[1]==null)?'—':String(p[1]))); });
  return d;
}
function crumb(items){
  var c=el('div',null,'crumb');
  items.forEach(function(it,i){ if(i) c.appendChild(el('span','›'));
    if(it[1]) c.appendChild(btn(it[0],null,it[1])); else c.appendChild(el('span',it[0])); });
  return c;
}

/* ⚠️ 有些欄位檢查寫在 run() 裡，而 run() 執行前面板已經關掉了——

var ACTION_FAILED=false;
function say(kind,title,detail,list){
  if(kind==='bad') ACTION_FAILED=true;
  var m=el('div',null,'msg '+kind);

var OPEN_PANEL=null;
function actionButton(spec){
  var b=btn(spec.label,'act'+(spec.risk?' risk':'')+(spec.primary?' go':''),function(){
    OPEN_PANEL=(OPEN_PANEL&&OPEN_PANEL.key===spec.label)?null:{key:spec.label,spec:spec,vals:{}};
    MSG=null; render();
  });
  if(spec.disabled){ b.disabled=true; b.title=spec.disabledWhy||''; }
  return b;
}
function panelFor(spec){
  var p=el('div',null,'panel'), vals={};
  /* ⚠️ 面板每次重繪會整個重建。驗證失敗時若不把使用者打好的字帶回來，
        他剛寫的原因就會被清空——實測時當場踩到。 */
  var keep=(OPEN_PANEL&&OPEN_PANEL.vals)||{};
  function remember(){
    Object.keys(vals).forEach(function(k){
      keep[k]=vals[k].type==='checkbox'?vals[k].checked:vals[k].value; });
    if(OPEN_PANEL) OPEN_PANEL.vals=keep;
  }
  function restore(n,node){
    if(Object.prototype.hasOwnProperty.call(keep,n)){
      if(node.type==='checkbox') node.checked=!!keep[n]; else node.value=keep[n];
    }
    node.addEventListener('input',remember); node.addEventListener('change',remember);
  }
  if(spec.note) p.appendChild(el('p',spec.note,'note'));
  (spec.fields||[]).forEach(function(f){
    var id='f_'+f.name, lb=el('label',f.label); lb.setAttribute('for',id); p.appendChild(lb);
    var inp;
    if(f.type==='select'){ inp=document.createElement('select');
      f.options.forEach(function(o){ var op=document.createElement('option');
        op.value=o[0]; op.textContent=o[1]; inp.appendChild(op); }); }
    else if(f.type==='textarea') inp=document.createElement('textarea');
    else { inp=document.createElement('input'); inp.type='text'; }
    inp.id=id; if(f.placeholder) inp.placeholder=f.placeholder;
    p.appendChild(inp); vals[f.name]=inp; restore(f.name,inp);
  });
  if(spec.reason){
    var rl=el('label','原因'); rl.setAttribute('for','f_reason'); p.appendChild(rl);
    var rt=document.createElement('textarea'); rt.id='f_reason';
    rt.placeholder='請寫具體原因，這段會留在紀錄裡';
    p.appendChild(rt); vals.reason=rt; restore('reason',rt);
  }
  if(spec.confirm){
    var w=el('div',null,'chk');
    var cb=document.createElement('input'); cb.type='checkbox'; cb.id='f_confirm';
    var cl=el('label',spec.confirm); cl.setAttribute('for','f_confirm');
    cl.style.color='var(--ink)'; cl.style.margin='0'; cl.style.letterSpacing='0';
    cl.style.fontSize='var(--font-sm)';
    w.appendChild(cb); w.appendChild(cl); p.appendChild(w);
    vals.confirmed=cb; restore('confirmed',cb);
  }
  var bar=el('div',null,'actions');
  bar.appendChild(btn('送出','act go',function(){
    remember();
    var v={}; Object.keys(vals).forEach(function(k){
      v[k]=vals[k].type==='checkbox'?vals[k].checked:vals[k].value; });
    if(spec.confirm&&!v.confirmed){ say('bad','請先勾選確認','這一步影響比較大，需要你明確確認。'); return; }
    if(spec.reason&&!String(v.reason||'').trim()){ say('bad','請填寫原因','這段會寫進紀錄，讓之後的人知道為什麼。'); return; }
    var saved=OPEN_PANEL;
    ACTION_FAILED=false; OPEN_PANEL=null;
    spec.run(v);
    if(ACTION_FAILED){ OPEN_PANEL=saved; render(); }   /* 把面板與已填內容還原 */
  }));
  bar.appendChild(btn('取消','act',function(){ OPEN_PANEL=null; MSG=null; render(); }));
  p.appendChild(bar);
  return p;
}

/* ─── 結案六項檢查（逐條對齊實機的 C1–C6）─── */
function closureChecks(c,mats){
  var need=mats.filter(function(x){ return x.req==='REQUIRED'; });
  var got=need.filter(function(x){ return x.receipt!=='NOT_RECEIVED'; });
  var complete=need.length>0&&got.length===need.length;
  var recorded=['RECORDED','EDITED','AWAITING_COUNTERPARTY','PUBLISHED','NOT_AIRED']
    .indexOf(c.production)>=0;
  var isCp=c.producer==='COUNTERPARTY';
  return [
    {label:'邀約結果已確定',pass:['ACCEPTED','DECLINED'].indexOf(c.decision)>=0,
     detail:'目前：'+lab('SR02',c.decision)},
    {label:'必要素材收齊了',pass:complete,
     detail:need.length? (complete?'已收齊':'還有 '+(need.length-got.length)+' 項沒收到')
                       :'還沒列任何必要素材'},
    {label:'訪綱狀態已確定',pass:c.script==='SCRIPT_READY'||!!String(c.noScriptReason||'').trim(),
     detail:c.script==='SCRIPT_READY'?'訪綱就緒':'需要填「為什麼不需要訪綱」'},
    {label:'錄製結果已確定',pass:recorded||!!String(c.noRecordReason||'').trim(),
     detail:recorded?'已錄製':'需要填「為什麼沒有錄」'},
    {label:'上架或不予上架已確定',
     pass:isCp?(c.production==='PUBLISHED'&&!!String(c.airingUrl||'').trim())
             :['PUBLISHED','NOT_AIRED'].indexOf(c.production)>=0,
     detail:isCp?'對方製作：要已上架而且填了上架連結':'公司製作：已上架或不予上架二選一'},
    {label:'例外情形都有寫原因',
     pass:(recorded||!!String(c.noRecordReason||'').trim())
        &&(c.script==='SCRIPT_READY'||!!String(c.noScriptReason||'').trim())
        &&(c.production!=='NOT_AIRED'||!!String(c.terminal||'').trim()),
     detail:'每個例外都要有對應的原因'}
  ];
}

function render(){
  var st=document.getElementById('stage'); clear(st);
  var modes=document.getElementById('modes'), hint=document.getElementById('modehint');
  var fb=document.getElementById('feedback');
  var lede=document.getElementById('lede');

  if(PHASE==='landing'){
    modes.hidden=true; hint.hidden=true; fb.hidden=true;
    lede.textContent='給公司同事試用的示意稿。全部是假資料，按什麼都不會壞。';
    renderLanding(st); return;
  }
  if(PHASE==='entry'){
    modes.hidden=true; hint.hidden=true; fb.hidden=true;
    lede.textContent='請選擇你要進入的功能。';
    renderEntry(st); return;
  }
  modes.hidden=false; hint.hidden=false; fb.hidden=(MODE==='B');
  lede.textContent='你是公司內部負責新書宣傳與訪談邀約的企劃。';
  /* ⚠️ 這一行以前只在點模式按鈕時才寫，所以剛從入口進來時是空白的。 */
  hint.textContent=(typeof HINT!=='undefined'&&HINT[MODE])||'';
  ['S','F','B'].forEach(function(k){
    document.getElementById('m'+k).setAttribute('aria-pressed',String(k===MODE)); });
  if(MODE==='S') renderScenario(st);
  else if(MODE==='F') renderFree(st);
  else renderFlow(st);
  syncFeedbackStep();
}

function renderScenario(st){
  var rail=el('div',null,'rail'); rail.setAttribute('aria-label','步驟');

  });
  st.appendChild(rail);

  var s=SCENARIO[STEP], card=el('div',null,'storycard');
  card.appendChild(el('div','第 '+(STEP+1)+' 步，共 '+SCENARIO.length+' 步','step'));

  var ol=document.createElement('ol');

  todo.appendChild(ol);
  if(s.watch) todo.appendChild(el('p','留意看：'+s.watch,'watch'));
  card.appendChild(todo);

  renderScreen(st);

  if(STEP>0) nb.appendChild(btn('← 上一步','act',function(){ gotoStep(STEP-1); }));

function gotoStep(i){
  STEP=Math.max(0,Math.min(SCENARIO.length-1,i));
  var p=SCENARIO[STEP].page, c={};
  if(p==='request'||p==='shortlist') c={req:DEMO.scenarioReq||'REQ-DEMO-001'};
  if(p==='case'||p==='materials') c={cas:DEMO.scenarioCase,req:DEMO.scenarioReq};
  PAGE=p; CTX=c; OPEN_PANEL=null; MSG=null;
  render();
  var n=document.getElementById('stage'); if(n) n.scrollIntoView({block:'start'});
}

/* ⭐ 純本機下載：用 Blob 造一個檔案再點自己造的連結。
      ⛔ 不送出任何請求、⛔ 不經過任何伺服器。 */
function download(name,mime,text){
  try{
    var blob=new Blob(['\ufeff'+text],{type:mime+';charset=utf-8'});  /* BOM 讓 Excel 也讀得出中文 */
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  }catch(e){
    alert('這個瀏覽器擋住了下載。內容已經顯示在下面，請自行全選複製。');
  }
}
function showOut(t){
  var n=document.getElementById('fbout'); if(!n) return; clear(n);
  if(!t) return;
  var p=el('div',t,'out'); p.setAttribute('tabindex','0'); n.appendChild(p);
  p.scrollIntoView({block:'nearest'});
}
function toMd(l){
  if(!l.length) return '（目前沒有任何回饋）';
  var o='# 新書訪談邀約 · 情境操作體驗回饋\n\n共 '+l.length+' 則。\n\n';
  l.forEach(function(r,i){
    if(r.step==='＊總體回饋'){
      o+='## 總體回饋\n\n';
      o+='- 時間：'+r.at+(r.who?'　填寫者：'+r.who:'')+'\n';
      o+='- 整體符合平常工作方式嗎：'+(r.overall||'')+'\n';
      if(r.biggest)      o+='- 最卡的一件事：'+r.biggest+'\n';
      if(r.missingEntry) o+='- 找不到入口的工作情境：'+r.missingEntry+'\n';
      if(r.note)         o+='- 其他建議：'+r.note+'\n';
      o+='\n'; return;
    }
    o+='## '+r.step+'（'+r.sev+'）\n\n';
    o+='- 時間：'+r.at+(r.who?'　填寫者：'+r.who:'')+'\n';
    o+='- 我知道下一步要做什麼嗎：'+r.know+'\n';
    o+='- 這個步驟符合平常工作方式嗎：'+r.fit+'\n';
    if(r.clear) o+='- 按鈕名稱是否容易理解：'+r.clear+'\n';
    if(r.seq)   o+='- 流程順序是否合理：'+r.seq+'\n';
    if(r.missing) o+='- 缺少的資訊：'+r.missing+'\n';
    if(r.label)   o+='- 按鈕名稱：'+r.label+'\n';
    if(r.order)   o+='- 流程順序：'+r.order+'\n';
    if(r.slow)    o+='- 卡最久的地方：'+r.slow+'\n';
    if(r.note)    o+='- 其他：'+r.note+'\n';
    o+='\n';
  });
  return o;
}

var HINT={
  S:'跟著步驟走一次，就像你真的在承辦這件事。',
  F:'不給步驟，你自己隨便按。',
  B:'看這套系統預定要涵蓋的完整流程，以及每一段做到什麼程度。'
};
function setMode(m){
  MODE=m;
  ['S','F','B'].forEach(function(k){
    document.getElementById('m'+k).setAttribute('aria-pressed',String(k===m)); });
  document.getElementById('modehint').textContent=HINT[m];
  if(m==='S') gotoStep(STEP); else render();
}
document.getElementById('mS').onclick=function(){ setMode('S'); };
document.getElementById('mF').onclick=function(){ setMode('F'); };
document.getElementById('mB').onclick=function(){ setMode('B'); };
