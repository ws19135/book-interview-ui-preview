<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>新書訪談邀約系統｜畫面與完整流程互動預覽</title>
<style>
/* ══════════════════════════════════════════════════════════════
   設計 token —— 逐字取自實機 80_WebUi.html 的 DESIGN.md Report 模式（②知性編輯）
   ⛔ 不引入任何外部資源：無 CDN、無字型 CDN、無追蹤碼。
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme: light;
  --report-bg:#ECE6DB; --report-card:#F5F1E8; --report-ink:#1A1A1A;
  --report-body:#5A5A5A; --report-taupe:#8A8178; --report-line:#B8B0A4;
  --report-accent:#B5451F;
  --serif:'Noto Serif TC','Songti TC',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--report-bg); color:var(--report-ink);
  font-family:var(--serif); font-size:14.5px; line-height:1.75;
}

/* ── 全站固定橫幅 ── */
.banner{
  position:sticky; top:0; z-index:50;
  background:var(--report-accent); color:#FFF8F2;
  font-family:var(--sans); font-size:12px; letter-spacing:.08em;
  padding:7px 16px; text-align:center;
}
.banner b{font-weight:600}

.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 96px}
/* ⚠️ 換頁時會把這一區捲到視窗頂端，但頂端有固定橫幅（約 35px）——
      不留這段空隙，導覽列會被橫幅蓋住（手機 390px 實測當場踩到）。 */
#secA{scroll-margin-top:48px}

/* ── 版頭 ── */
.eyebrow{font-family:var(--sans);font-size:11.5px;font-weight:400;
  letter-spacing:.22em;text-transform:uppercase;color:var(--report-taupe);margin:0}
h1{font-size:24px;font-weight:700;margin:5px 0 3px;letter-spacing:.01em;text-wrap:balance}
h2{font-size:17px;font-weight:700;margin:28px 0 10px;text-wrap:balance}
h3{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--report-taupe);margin:22px 0 8px}
h4{font-family:var(--sans);font-size:13px;font-weight:600;margin:16px 0 6px}
.sub{font-size:15px;font-weight:400;color:var(--report-body);margin:0 0 20px}
.rule{border:0;border-top:1px solid var(--report-line);margin:20px 0}
p{margin:0 0 10px}

/* ── 模式切換 ── */
.modes{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.modes button{
  font-family:var(--sans);font-size:13px;padding:8px 15px;cursor:pointer;
  background:transparent;border:1px solid var(--report-line);color:var(--report-body);
  ;
}
.modes button[aria-pressed="true"]{
  background:var(--report-ink);border-color:var(--report-ink);color:var(--report-card);font-weight:600;
}
.modehint{font-family:var(--sans);font-size:12.5px;color:var(--report-taupe);margin:0 0 18px}

/* ── 實機導覽（模式 A）── */
nav{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 6px;
  border-bottom:1px solid var(--report-line);padding-bottom:9px}
nav button{background:none;border:0;padding:0 0 3px;cursor:pointer;
  font-family:var(--serif);font-size:14.5px;color:var(--report-body);
  border-bottom:1px solid transparent}
nav button:hover,nav button:focus-visible{color:var(--report-ink);border-bottom-color:var(--report-line)}
nav button[aria-current="page"]{color:var(--report-ink);border-bottom-color:var(--report-accent);font-weight:600}
.navnote{font-family:var(--sans);font-size:11.5px;color:var(--report-taupe);margin:7px 0 20px}

/* ── 麵包屑 ── */
.crumb{font-family:var(--sans);font-size:12px;color:var(--report-taupe);margin:0 0 14px}
.crumb button{background:none;border:0;padding:0;cursor:pointer;font:inherit;
  color:var(--report-body);text-decoration:underline;text-underline-offset:2px}
.crumb span{margin:0 7px}

/* ── 表格 ── */
.tablewrap{overflow-x:auto;margin:0 0 12px;border-top:1px solid var(--report-line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:520px}
th{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--report-taupe);text-align:left;
  padding:9px 10px 8px;border-bottom:1px solid var(--report-line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid rgba(184,176,164,.45);vertical-align:top}
tr:last-child td{border-bottom:0}
.empty{padding:18px 10px;color:var(--report-taupe);font-family:var(--sans);font-size:12.5px}

/* ── KPI ── */
.figs{display:flex;flex-wrap:wrap;gap:0;margin:6px 0 18px;
  border-top:1px solid var(--report-line);border-bottom:1px solid var(--report-line)}
.fig{flex:1;min-width:150px;padding:14px 18px 14px 0}
.fig .n{font-family:Georgia,'Songti TC',serif;font-size:17px;color:var(--report-ink);font-variant-numeric:tabular-nums}
.fig .l{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--report-taupe);margin-top:2px}

/* ── 名稱值對照 ── */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;margin:0 0 16px;font-size:13.5px}
.kv dt{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;color:var(--report-taupe);
  text-transform:uppercase;padding-top:3px}
.kv dd{margin:0}

/* ── 按鈕 ── */
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
button.act{
  font-family:var(--sans);font-size:13px;padding:7px 14px;cursor:pointer;
  background:var(--report-card);border:1px solid var(--report-line);color:var(--report-ink);
}
button.act:hover,button.act:focus-visible{border-color:var(--report-ink)}
button.act.risk{border-color:var(--report-accent);color:var(--report-accent)}
button.link{background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans);font-size:12.5px;
  color:var(--report-accent);text-decoration:underline;text-underline-offset:2px}
button.link.q{color:var(--report-body)}
:focus-visible{outline:2px solid var(--report-accent);outline-offset:2px}

/* ── 面板（模擬 actionButton 展開）── */
.panel{border:1px solid var(--report-line);background:var(--report-card);
  padding:16px 16px 14px;margin:10px 0 14px}
.panel .note{font-family:var(--sans);font-size:12px;color:var(--report-body);margin:0 0 12px}
.panel label{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;
  color:var(--report-taupe);text-transform:uppercase;margin:10px 0 3px}
.panel input[type=text],.panel select,.panel textarea{
  width:100%;font-family:var(--sans);font-size:13.5px;padding:7px 9px;
  border:1px solid var(--report-line);background:#FFFDF9;color:var(--report-ink)}
.panel textarea{min-height:64px;resize:vertical}
.panel .chk{display:flex;gap:8px;align-items:flex-start;margin:12px 0 2px;
  font-family:var(--sans);font-size:12.5px;color:var(--report-ink)}
.panel .chk input{margin-top:3px;flex:none}

/* ── 訊息 ── */
/* ⭐ 逐字對齊實機公開表單的 .msg：**完整 1px 外框**，狀態靠整個框與文字上色。
      ⛔ 不用單邊粗色條——實機一條都沒有，那也是很典型的 AI 生成味。 */
.msg{font-family:var(--sans);font-size:13px;padding:11px 14px;margin:12px 0;
  border:1px solid var(--report-line);background:var(--report-card)}
.msg.ok{border-color:var(--report-ink)}
.msg.bad{border-color:var(--report-accent);color:var(--report-accent)}
.msg.bad .d{color:var(--report-accent)}
.msg .t{font-weight:600}
.msg .d{color:var(--report-body);margin-top:2px}

.legacy{font-family:var(--sans);font-size:12px;color:var(--report-taupe);margin:8px 0 14px}
.mask{font-family:var(--sans);letter-spacing:.14em;color:var(--report-taupe)}
.denied{border:1px solid var(--report-line);background:var(--report-card);
  padding:34px 22px;text-align:center;margin:14px 0}
.denied p{margin:0 0 6px;font-size:16px}
.denied .d{font-family:var(--sans);font-size:12.5px;color:var(--report-body)}

/* ── 狀態晶片 ── */
/* ⭐ 只用既有 token ＋ 邊框樣式區分證據強度——⛔ 不另外發明配色，
      實機那份 CSS 一共只有 7 個顏色，這裡不擴張。
      實線＝有證據　虛線＝還沒有　赭紅＝要留意 */
.chip{display:inline-block;font-family:var(--sans);font-size:10.5px;letter-spacing:.05em;
  padding:2px 7px;border:1px solid var(--report-line);
  color:var(--report-body);white-space:nowrap;background:rgba(255,253,249,.6)}
.chip.live{border-color:var(--report-ink);color:var(--report-ink);font-weight:600}
.chip.r2{border-color:var(--report-body);color:var(--report-body)}
.chip.harness{border-style:dashed;border-color:var(--report-body);color:var(--report-body)}
.chip.nomulti{border-color:var(--report-accent);color:var(--report-accent)}
.chip.phase2{border-style:dashed;color:var(--report-taupe)}
.chip.out{border-style:dashed;color:var(--report-taupe);opacity:.75}
.chip.known{border-color:var(--report-accent);color:var(--report-accent)}

/* ── 流程藍圖（模式 B）── */
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0 22px;
  padding:14px;border:1px solid var(--report-line);background:var(--report-card)}
.legend div{font-family:var(--sans);font-size:12px;color:var(--report-body)}
.flow{display:grid;gap:0;margin:0 0 24px}
.stage{border:1px solid var(--report-line);background:var(--report-card);
  padding:13px 15px;position:relative}
.stage .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;justify-content:space-between}
.stage .nm{font-weight:700;font-size:15px}
.stage .idx{font-family:var(--sans);font-size:11px;color:var(--report-taupe);letter-spacing:.1em}
.stage .desc{font-family:var(--sans);font-size:12.5px;color:var(--report-body);margin:6px 0 0}
.stage .states{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:5px}
.arrow{text-align:center;color:var(--report-line);font-size:17px;line-height:1;margin:5px 0}

/* ── 對照表 ── */
.matrix td:first-child{font-weight:600}
.matrix td{font-size:13px}

/* ── 回饋工具 ── */
.fb{border:1px solid var(--report-line);background:var(--report-card);
  padding:18px;margin:22px 0 0}
.fb .grid{display:grid;gap:12px}
.fb label{display:block;font-family:var(--sans);font-size:11.5px;letter-spacing:.05em;
  color:var(--report-taupe);text-transform:uppercase;margin:0 0 3px}
.fb select,.fb textarea,.fb input[type=text]{
  width:100%;font-family:var(--sans);font-size:13.5px;padding:7px 9px;
  border:1px solid var(--report-line);background:#FFFDF9;color:var(--report-ink)}
.fb textarea{min-height:56px;resize:vertical}
.fb .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fbnote{font-family:var(--sans);font-size:12px;color:var(--report-accent);margin:12px 0 0;font-weight:600}
.fblist{margin:14px 0 0;font-family:var(--sans);font-size:12.5px;color:var(--report-body)}
.fblist li{margin:0 0 4px}
/* 匯出內容是要整段複製走的原始文字，等寬才對得齊；用泛型關鍵字，⛔ 不指定具體字型 */
.out{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:11.5px;
  background:#FFFDF9;border:1px solid var(--report-line);padding:12px;
  max-height:260px;overflow:auto;margin:12px 0 0}

/* ── 手機 ── */
@media (max-width:640px){
  .wrap{padding:20px 14px 88px}
  h1{font-size:20px}
  .fb .row2{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dd{margin:0 0 8px}
  nav{gap:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="banner">互動示意稿｜<b>全部為假資料</b>｜不連資料庫</div>

<div class="wrap">
  <p class="eyebrow">SDH · Editorial</p>
  <h1>新書訪談邀約系統｜畫面與完整流程互動預覽</h1>
  <p class="sub">給 Owner 與同事查看、點擊、留回饋用。所有操作只在你的瀏覽器記憶體中模擬，重新整理即可重置。</p>

  <div class="modes" role="group" aria-label="預覽模式">
    <button id="mA" aria-pressed="true">模式 A · 目前已完成</button>
    <button id="mB" aria-pressed="false">模式 B · 完整流程藍圖</button>
    <button id="mM" aria-pressed="false">現況／Roadmap 對照</button>
    <button class="act" id="btnReset" style="margin-left:auto">重置 Demo</button>
  </div>
  <p class="modehint" id="modehint"></p>

  <hr class="rule">

  <!-- ══════════ 模式 A ══════════ -->
  <section id="secA">
    <nav id="nav" aria-label="系統主導覽"></nav>
    <p class="navnote">⚠️ 實機頂端只有這 4 個入口。需求詳情、名單確認、訪談案件、素材完整性都是<b>從需求清單往下鑽</b>，靠麵包屑回上一層。</p>
    <div id="main"></div>

    <hr class="rule">
    <h3>不在主導覽裡的畫面</h3>
    <div class="actions">
      <button class="act" data-goto="denied">找不到項目／拒絕頁</button>
      <button class="act" data-goto="intake">公開收件表單</button>
      <button class="act" data-goto="idor">模擬猜 ID 越權</button>
    </div>
    <p class="legacy">公開收件表單是<b>另一個獨立部署</b>的匿名頁面，不在內部系統的導覽列裡。</p>
  </section>

  <!-- ══════════ 模式 B ══════════ -->
  <section id="secB" hidden></section>

  <!-- ══════════ 對照表 ══════════ -->
  <section id="secM" hidden></section>

  <hr class="rule">

  <!-- ══════════ 回饋 ══════════ -->
  <section id="feedback"></section>

  <hr class="rule">
  <p class="legacy" style="margin-top:18px">
    本輪是 <b>UI／流程驗收</b>，不是權限、安全、資料正確性或正式上線驗收。<br>
    這份預覽不含任何真實資料、識別碼或連線設定。
  </p>
</div>

     1. ⛔ 完全沒有任何對外呼叫：沒有 Apps Script 遠端呼叫、沒有非同步請求、

     2. 不連任何資料庫。所有狀態只在 DEMO 這個記憶體物件裡。
     3. 只有回饋會寫 localStorage，且永不上傳。

/* ─────────── DOM 小工具（一律 textContent）─────────── */
function el(tag,text,cls){ var e=document.createElement(tag);
  if(text!==null&&text!==undefined&&text!=='') e.textContent=text;
  if(cls) e.className=cls; return e; }
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); }
function btn(label,cls,fn){ var b=el('button',label,cls); b.type='button'; b.onclick=fn; return b; }

function table(cols,rows,opts){
  var o=opts||{}, w=el('div',null,'tablewrap'), t=document.createElement('table');
  var thead=document.createElement('thead'), hr=document.createElement('tr');
  cols.forEach(function(c){ hr.appendChild(el('th',c.label)); });
  if(o.rowActions) hr.appendChild(el('th','動作'));
  thead.appendChild(hr); t.appendChild(thead);
  var tb=document.createElement('tbody');
  if(!rows.length){
    var tr=document.createElement('tr'), td=document.createElement('td');
    td.colSpan=cols.length+(o.rowActions?1:0);
    td.appendChild(el('div','目前沒有資料。','empty')); tr.appendChild(td); tb.appendChild(tr);
  }
  rows.forEach(function(r){
    var tr=document.createElement('tr');
    cols.forEach(function(c){
      var td=document.createElement('td');
      if(c.render){ c.render(td,r); } else {
        var v=r[c.key];
        if(v===MASK && o.unmask && o.unmask.indexOf(c.key)>=0){
          td.appendChild(el('span',MASK,'mask'));
          td.appendChild(document.createTextNode(' '));
          td.appendChild(btn('查看','link q',function(){ doUnmask(o.pkTable,r[o.pk],c.key); }));
        } else { td.textContent=(v===''||v===undefined||v===null)?'—':String(v); }
      }
      tr.appendChild(td);
    });
    if(o.rowActions){ var ta=document.createElement('td'); o.rowActions(ta,r); tr.appendChild(ta); }
    tb.appendChild(tr);
  });
  t.appendChild(tb); w.appendChild(t); return w;
}
function kv(pairs){
  var d=document.createElement('dl'); d.className='kv';
  pairs.forEach(function(p){
    d.appendChild(el('dt',p[0]));
    d.appendChild(el('dd',(p[1]===''||p[1]===undefined||p[1]===null)?'—':String(p[1])));
  });
  return d;
}
function crumb(items){
  var c=el('div',null,'crumb');
  items.forEach(function(it,i){
    if(i) c.appendChild(el('span','›'));
    if(it[1]) c.appendChild(btn(it[0],null,it[1]));
    else c.appendChild(el('span',it[0]));
  });
  return c;
}

var OPEN_PANEL=null;
function actionButton(spec){
  var b=btn(spec.label,'act'+(spec.risk?' risk':''),function(){
    OPEN_PANEL = (OPEN_PANEL && OPEN_PANEL.key===spec.label) ? null : {key:spec.label,spec:spec};
    render();
  });
  return b;
}
function panelFor(spec){
  var p=el('div',null,'panel'), vals={};
  /* ⚠️ 面板每次重繪都會整個重建。驗證失敗時如果不把使用者打好的字帶回來，
        他剛寫的原因就會被清空——實測時當場踩到。所以一律先存再還原。 */
  var keep = (OPEN_PANEL && OPEN_PANEL.vals) || {};
  function remember(){
    Object.keys(vals).forEach(function(k){
      keep[k] = vals[k].type==='checkbox' ? vals[k].checked : vals[k].value; });
    if(OPEN_PANEL) OPEN_PANEL.vals=keep;
  }
  function restore(name,node){
    if(Object.prototype.hasOwnProperty.call(keep,name)){
      if(node.type==='checkbox') node.checked=!!keep[name]; else node.value=keep[name];
    }
    node.addEventListener('input',remember);
    node.addEventListener('change',remember);
  }
  if(spec.note) p.appendChild(el('p',spec.note,'note'));
  (spec.fields||[]).forEach(function(f){
    var id='f_'+f.name;
    var lb=el('label',f.label); lb.setAttribute('for',id); p.appendChild(lb);
    var inp;
    if(f.type==='select'){
      inp=document.createElement('select');
      f.options.forEach(function(o){ var op=document.createElement('option');
        op.value=o[0]; op.textContent=o[1]; inp.appendChild(op); });
    } else if(f.type==='textarea'){ inp=document.createElement('textarea'); }
    else { inp=document.createElement('input'); inp.type='text'; }
    inp.id=id; if(f.placeholder) inp.placeholder=f.placeholder;
    p.appendChild(inp); vals[f.name]=inp; restore(f.name,inp);
  });
  if(spec.reason){
    var rl=el('label','原因'); rl.setAttribute('for','f_reason'); p.appendChild(rl);
    var rt=document.createElement('textarea'); rt.id='f_reason';
    rt.placeholder='請寫具體原因，這段會留在稽核紀錄裡';
    p.appendChild(rt); vals.reason=rt; restore('reason',rt);
  }
  if(spec.confirm){
    var wrapc=el('div',null,'chk');
    var cb=document.createElement('input'); cb.type='checkbox'; cb.id='f_confirm';
    var cl=el('label',spec.confirm); cl.setAttribute('for','f_confirm');
    cl.style.textTransform='none'; cl.style.letterSpacing='0';
    cl.style.color='var(--report-ink)'; cl.style.fontSize='12.5px'; cl.style.margin='0';
    wrapc.appendChild(cb); wrapc.appendChild(cl); p.appendChild(wrapc);
    vals.confirmed=cb; restore('confirmed',cb);
  }
  var bar=el('div',null,'actions');
  bar.appendChild(btn('送出','act',function(){
    remember();                       /* ⭐ 先把使用者打的字存起來再驗證 */
    var v={};
    Object.keys(vals).forEach(function(k){
      v[k]= vals[k].type==='checkbox' ? vals[k].checked : vals[k].value;
    });
    if(spec.confirm && !v.confirmed){ say('bad','請先勾選確認','這是高風險操作，需要你明確確認。'); return; }
    if(spec.reason && !String(v.reason||'').trim()){ say('bad','請填寫原因','這段會寫進稽核紀錄。'); return; }
    OPEN_PANEL=null;
    spec.run(v);
  }));
  bar.appendChild(btn('取消','act',function(){ OPEN_PANEL=null; render(); }));
  p.appendChild(bar);
  return p;
}

/* ─────────── 模擬寫入的共用路徑 ─────────── */
var SEEN_KEYS = {};                     /* 模擬冪等鍵 */
function submit(key,expectedV,currentV,okText,apply){
  /* ① 冪等重送：同一把鍵只生效一次 */
  if(SEEN_KEYS[key]){
    say('ok','這筆已經處理過了','系統沒有再寫一次，畫面已帶到目前結果。');
    return;
  }
  /* ② 版本過期（stale update）拒絕 */
  if(expectedV!==null && expectedV!==currentV){
    say('bad','這筆資料在你操作期間被別人改過了',
        '為了不覆蓋別人的修改，這次沒有寫入。請重新整理後再試一次。（E_CONCURRENT_MODIFICATION）');
    DEMO.staleArmed=false;
    return;
  }
  SEEN_KEYS[key]=true;
  apply();
  DEMO.seq.evt++;
  say('ok',okText,'');
}
function audit(action,label,target){
  DEMO.audit.unshift({at:nowStamp(),actor:'R2-DEMO',action:action,label:label,target:target});
}
function nowStamp(){
  var d=new Date(), p=function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function expectedVersionFor(realV){ return DEMO.staleArmed ? realV-1 : realV; }

function doUnmask(tbl,id,field){
  DEMO.unmasked[tbl+':'+id+':'+field]=true;
  audit('FR-46','查看個資欄位',tbl);

}

    } else if(f.type==='textarea'){ inp=document.createElement('textarea'); }
    else { inp=document.createElement('input'); inp.type='text'; }
    inp.id=id; form.appendChild(inp); inputs[f.f]=inp;
    if(f.hint) form.appendChild(el('p',f.hint,'legacy'));
    if(f.link) form.appendChild(el('p','↗ '+f.link+'（實機是外連按鈕）','legacy'));
  });
  var sb=el('div',null,'actions');
  sb.appendChild(btn('送出需求','act',function(){
    var missing=[];
    INTAKE_SPEC.forEach(function(f){
      var required=(f.req===true)||(f.req===INTAKE_DIR);
      if(!required) return;
      var inp=inputs[f.f]; if(!inp) return;
      if(!String(inp.value||'').trim()) missing.push(f.q+'. '+f.label);
    });
    if(missing.length){
      say('bad','還有 '+missing.length+' 題必填沒有填', missing.slice(0,4).join('、')+(missing.length>4?' …':''));
      return;
    }
    INTAKE_DONE='REQ-DEMO-'+String(++DEMO.seq.req).padStart(3,'0');
    DEMO.requests.unshift({id:INTAKE_DONE,direction:INTAKE_DIR,status:'RECEIVED',
      book:inputs.book_title_raw?inputs.book_title_raw.value:'',
      program:inputs.program_title_raw?inputs.program_title_raw.value:'',
      listV:0,v:1,name:inputs.requester_name.value,
      contact:inputs.requester_contact.value,channel:'PUBLIC_FORM',
      window:inputs.desired_window.value,
      expected:inputs.expected_list_raw?inputs.expected_list_raw.value:''});
    audit('FR-39','登記需求（對外表單）','Requests');
    render();
  }));
  form.appendChild(sb);
  main.appendChild(form);
  main.appendChild(el('p','⚠️ 送出後這筆會出現在內部「需求清單」，來源標成「對外表單」——你可以切回去看。','legacy'));
};

  if(!text) return;
  var pre=el('div',text,'out'); n.appendChild(pre);
  pre.setAttribute('tabindex','0');
  pre.scrollIntoView({block:'nearest'});
}
function toMd(list){
  if(!list.length) return '（目前沒有任何回饋）';
  var out='# 新書訪談邀約系統 · UI 測試回饋\n\n共 '+list.length+' 則。\n\n';
  list.forEach(function(r,i){
    out+='## '+(i+1)+'. '+r.screen+'（'+r.severity+'）\n\n';
    out+='- 時間：'+r.at+(r.who?'　填寫者：'+r.who:'')+'\n';
    out+='- 看得懂嗎：'+r.understand+'\n';
    out+='- 操作順不順：'+r.smooth+'\n';
    if(r.missing) out+='- 缺少的資訊：'+r.missing+'\n';
    if(r.button)  out+='- 按鈕名稱建議：'+r.button+'\n';
    if(r.order)   out+='- 流程順序建議：'+r.order+'\n';
    if(r.note)    out+='- 備註：'+r.note+'\n';
    out+='\n';
  });
  return out;
}
function renderFeedbackScreen(){
  var s=document.getElementById('fb_screen');
  if(s && SCREEN_NAMES[PAGE]) s.value=SCREEN_NAMES[PAGE];
}

/* ═══════════════ 啟動 ═══════════════ */
var HINTS={
  A:'忠實呈現目前版本已經存在的畫面。⛔ 沒做的東西不會出現在這裡。',
  B:'系統預定的完整生命週期，每一段標了驗到什麼程度。⛔ 這裡的東西不代表已經做好。',
  M:'左邊是實際部署的現況，右邊是這份 Demo 與尚未證實的部分。'
};
function setMode(m){
  ['A','B','M'].forEach(function(k){
    document.getElementById('sec'+k).hidden = (k!==m);
    document.getElementById('m'+k).setAttribute('aria-pressed',String(k===m));
  });
  document.getElementById('modehint').textContent=HINTS[m];
  if(m==='B') buildB();
  if(m==='M') buildM();
  if(m==='A') render();
}
document.getElementById('mA').onclick=function(){ setMode('A'); };
document.getElementById('mB').onclick=function(){ setMode('B'); };
document.getElementById('mM').onclick=function(){ setMode('M'); };
document.getElementById('btnReset').onclick=function(){
  resetDemo(); SEEN_KEYS={}; INTAKE_DONE=null; INTAKE_DIR='AUTHOR_INITIATED';
  PAGE='home'; CTX={}; OPEN_PANEL=null; MSG=null;
  setMode('A');
  say('ok','Demo 已重置','假資料回到初始狀態。⛔ 你填的回饋沒有被清掉。');
};
document.querySelectorAll('[data-goto]').forEach(function(b){
  b.onclick=function(){ go(b.getAttribute('data-goto')); };
});

buildFeedback();
setMode('A');
</script>
