<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>新書訪談邀約｜情境操作體驗</title>
<style>
/* ══════════════════════════════════════════════════════════════
   色彩取自實機（DESIGN.md Report 模式）。
   ⭐ 所有看得到的字 ≥13px、輸入欄 ≥16px，全部走 token。
   ⛔ 無外部資源、⛔ 無卡片陰影、⛔ 無裝飾性元件。
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme: light;
  --bg:#ECE6DB; --card:#F5F1E8; --ink:#1A1A1A;
  --body:#5A5A5A; --taupe:#7A736A; --line:#B8B0A4;
  --accent:#B5451F;
  --serif:'Noto Serif TC','Songti TC',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  --font-xs:13px; --font-sm:14px; --font-base:15px; --font-md:16px;
  --font-lg:18px; --font-xl:22px; --font-display:28px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--serif);font-size:var(--font-base);line-height:1.8}

.banner{position:sticky;top:0;z-index:50;background:var(--accent);color:#FFF8F2;
  font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.06em;
  padding:9px 16px;text-align:center}
.banner b{font-weight:600}
.disclose{margin:0;padding:10px 16px;text-align:center;background:var(--card);
  border-bottom:1px solid var(--line);font-family:var(--sans);
  font-size:var(--font-xs);color:var(--body)}

.wrap{max-width:820px;margin:0 auto;padding:26px 20px 96px}
#stage{scroll-margin-top:60px}

.eyebrow{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.2em;
  color:var(--taupe);margin:0}
h1{font-size:var(--font-display);font-weight:700;margin:6px 0 4px;
  line-height:1.35;text-wrap:balance}
h2{font-size:var(--font-lg);font-weight:700;margin:26px 0 10px;text-wrap:balance}
h3{font-family:var(--sans);font-size:var(--font-xs);font-weight:600;letter-spacing:.08em;
  color:var(--taupe);margin:22px 0 8px}
.sub{font-size:var(--font-md);color:var(--body);margin:0 0 22px}
.rule{border:0;border-top:1px solid var(--line);margin:22px 0}
p{margin:0 0 10px}

/* ── 開場 ── */
.hero{border:1px solid var(--line);background:var(--card);padding:30px 26px;margin:0 0 20px}
.hero h2{font-size:var(--font-xl);margin:0 0 14px}
.hero p{font-size:var(--font-md);margin:0 0 12px}
.hero dl{border-top:1px solid var(--line);margin:18px 0 0;padding:16px 0 0}
.hero dt{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);margin:0 0 2px}
.hero dd{margin:0 0 12px;font-size:var(--font-base)}

.tile{display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  border:1px solid var(--line);background:var(--card);padding:22px 24px;margin:0 0 14px}
.tile:hover,.tile:focus-visible{border-color:var(--ink)}
.tile .tn{font-size:var(--font-lg);font-weight:700;margin:0 0 6px}
.tile .td{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);margin:0}
.tile .tgo{font-family:var(--sans);font-size:var(--font-xs);color:var(--accent);margin:12px 0 0}

/* ── 進度 ── */
.prog{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding:0 0 10px;margin:0 0 18px}
.prog .n{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.1em;color:var(--taupe)}
.prog .bar{flex:1;min-width:120px;height:3px;background:var(--line);position:relative}
.prog .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);display:block}

/* ── 階段卡 ── */
.task{border:1px solid var(--line);background:var(--card);padding:22px 24px;margin:0 0 18px}
.task h2{font-size:var(--font-xl);margin:0 0 4px}
.task .why{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);margin:0 0 12px}
.task p{font-size:var(--font-md);margin:0 0 10px}
.task .ask{margin:16px 0 0;padding:14px 0 0;border-top:1px solid var(--line);
  font-family:var(--sans);font-size:var(--font-md);color:var(--ink);font-weight:600}

/* ── 資料卡（唯讀顯示已填好的資料）── */
.rec{border:1px solid var(--line);margin:0 0 16px}
.rec .rh{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.06em;color:var(--taupe);
  padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0;padding:14px}
.rec dt{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);padding-top:3px}
.rec dd{margin:0;font-size:var(--font-base)}

/* ── 可選節目 ── */
.opt{display:block;width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;
  border:1px solid var(--line);background:var(--card);padding:14px 16px;margin:0 0 10px}
.opt:hover,.opt:focus-visible{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent);border-width:1px}
.opt .on{font-size:var(--font-md);font-weight:700;margin:0 0 4px}
.opt .oc{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);margin:0 0 6px}
.opt .of{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);margin:0}
.opt .pick{font-family:var(--sans);font-size:var(--font-xs);color:var(--accent);
  margin:8px 0 0;font-weight:600}

/* ── 按鈕 ── */
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0;align-items:center}
button.act{font-family:var(--sans);font-size:var(--font-md);padding:12px 22px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);color:var(--ink)}
button.act:hover,button.act:focus-visible{border-color:var(--ink)}
button.act.go{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
button.act.small{font-size:var(--font-sm);padding:8px 14px}
button.act:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans);
  font-size:var(--font-sm);color:var(--accent);text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

label.fld{display:block;font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);
  margin:14px 0 4px}
input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:var(--font-md);
  padding:10px 12px;border:1px solid var(--line);background:#FFFDF9;color:var(--ink)}
textarea{min-height:70px;resize:vertical}

.msg{font-family:var(--sans);font-size:var(--font-sm);padding:12px 15px;margin:14px 0;
  border:1px solid var(--line);background:var(--card)}
.msg.ok{border-color:var(--ink)}
.msg.bad{border-color:var(--accent);color:var(--accent)}
.msg .t{font-weight:600}
.msg .d{color:var(--body);margin-top:3px}
.msg.bad .d{color:var(--accent)}
.msg ul{margin:8px 0 0;padding-left:20px}

.note{font-family:var(--sans);font-size:var(--font-sm);color:var(--taupe);margin:10px 0 14px}
.mask{font-family:var(--sans);letter-spacing:.14em;color:var(--taupe)}

.tablewrap{overflow-x:auto;margin:0 0 12px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:var(--font-sm);
  font-variant-numeric:tabular-nums;min-width:480px}
th{font-family:var(--sans);font-size:var(--font-xs);font-weight:600;letter-spacing:.06em;
  color:var(--taupe);text-align:left;padding:10px 11px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px;border-bottom:1px solid rgba(184,176,164,.45);vertical-align:top}
tr:last-child td{border-bottom:0}

.chip{display:inline-block;font-family:var(--sans);font-size:var(--font-xs);
  padding:3px 9px;border:1px solid var(--line);color:var(--body);
  white-space:nowrap;background:rgba(255,253,249,.6)}
.chip.now{border-color:var(--ink);color:var(--ink)}
.chip.prop{border-color:var(--accent);color:var(--accent)}
.chip.ok{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip.wait{border-style:dashed;color:var(--taupe)}

/* ── 每一步的選填回饋 ── */
.stepnote{border-top:1px solid var(--line);margin:22px 0 0;padding:16px 0 0}
.stepnote label{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);
  display:block;margin:0 0 6px}
.saved{font-family:var(--sans);font-size:var(--font-xs);color:var(--accent);margin:8px 0 0}

/* ── 最後四題 ── */
.final{border:1px solid var(--line);background:var(--card);padding:22px 24px;margin:0 0 18px}
.final h2{margin:0 0 14px}
.final .row{margin:0 0 16px}
.fbnote{font-family:var(--sans);font-size:var(--font-sm);color:var(--accent);
  margin:14px 0 0;font-weight:600}
.out{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:var(--font-xs);
  background:#FFFDF9;border:1px solid var(--line);padding:14px;max-height:260px;
  overflow:auto;margin:14px 0 0;line-height:1.6}

details.notes{border-top:1px solid var(--line);margin:30px 0 0;padding:18px 0 0}
details.notes summary{font-family:var(--sans);font-size:var(--font-sm);color:var(--taupe);
  cursor:pointer;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:'▸ ';color:var(--line)}
details.notes[open] summary::before{content:'▾ '}
details.notes .inner{margin:16px 0 0;font-family:var(--sans);font-size:var(--font-sm);color:var(--body)}
details.notes .inner h4{font-size:var(--font-sm);font-weight:600;color:var(--ink);margin:18px 0 6px}
details.notes .inner ul{margin:0 0 10px;padding-left:20px}
details.notes .inner li{margin:0 0 4px}
details.notes .inner table{min-width:560px;font-size:var(--font-xs)}

@media (max-width:640px){
  .wrap{padding:20px 15px 88px}
  h1{font-size:var(--font-xl)}
  .hero,.task,.final{padding:18px 16px}
  .task h2{font-size:var(--font-lg)}
  .rec dl{grid-template-columns:1fr;gap:2px 0}
  .rec dd{margin:0 0 10px}
  button.act{width:100%;justify-content:center}
  .actions{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="banner">互動示意稿｜<b>全部為假資料</b>｜不連資料庫</div>
<p class="disclose">本案例中的人物、書名、出版社、節目與聯絡資料全部為虛構。</p>

<div class="wrap">
  <p class="eyebrow">SDH</p>
  <h1>新書訪談邀約｜情境操作體驗</h1>
  <p class="sub" id="lede"></p>
  <hr class="rule">
  <div id="stage"></div>

  <details class="notes" id="notes">
    <summary>設計與驗證備註（給專案負責人看的技術細節，同事可以略過）</summary>
    <div class="inner" id="notesinner"></div>
  </details>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   ⛔ 完全沒有對外呼叫：沒有遠端請求、沒有長連線、沒有 CDN、沒有外部字型。
      ⚠️ 連這些名字的字面值都不出現在本檔。
   ⛔ 不連任何資料庫。狀態只在 DEMO 這個記憶體物件裡。
   ⭐ 只有回饋會寫瀏覽器本機儲存，且永不上傳。
   ⭐ 一律 textContent，⛔ 不用 innerHTML。
   ⭐ 主要流程不出現工程詞彙；技術細節一律收進頁尾摺疊區。
   ══════════════════════════════════════════════════════════════ */

var STORY={
  author:'林以安老師',
  book:'《在變動裡，找到自己的節奏》',
  publisher:'遠方學堂出版（虛構）',
  contact:'yian.lin@example.invalid',
  editor:'蔡宜蓁',
  owner:'Ivy（總經紀人）',
  prefer:'《慢慢說》'
};

/* 可挑選的節目清單 —— 全部虛構。依 Ivy 回饋：先給推薦原因與是否可能要宣傳費。 */
function programSeed(){
  return [
    {id:'P1',name:'《慢慢說》',topic:'教育・親子',
     reason:'聽眾與本書讀者重疊高，主持人長期關注教育現場',fee:'NONE',amount:''},
    {id:'P2',name:'《上班的事》',topic:'職場',
     reason:'職場轉換的主題貼近本書第三章',fee:'NONE',amount:''},
    {id:'P3',name:'《午後書桌》',topic:'文學・閱讀',
     reason:'專做新書專訪，製作品質穩定',fee:'MAYBE',amount:''},
    {id:'P4',name:'《週三讀什麼》',topic:'閱讀',
     reason:'過去合作過兩次，回覆速度快',fee:'NONE',amount:''},
    {id:'P5',name:'《城市晚讀》',topic:'生活',
     reason:'觸及數大，但主題比較泛，未必聚焦這本書',fee:'YES',amount:'15,000'}
  ];
}
var FEE_LABEL={NONE:'不需要宣傳費',MAYBE:'可能需要宣傳費（待確認）',YES:'需要宣傳費'};

/* ─────────── 狀態 ─────────── */
var DEMO;
function resetDemo(){
  DEMO={
    handedOver:false, owner:'',
    request:{id:'REQ-DEMO-004',status:'尚未建立',window:'2026 年 11 月中到 12 月初'},
    programs:programSeed(),
    picked:[],                       /* 已加入推薦的節目 id */
    approval:{needed:false,done:false,why:''},
    shortlistSent:false,
    replies:{},                      /* id -> ACCEPT / REJECT / WAIT */
    caseMade:false,
    producer:'', times:[], confirmedTime:'',
    production:'NOT_STARTED', airingUrl:'',
    materials:[
      {id:'M1',name:'公關書（實體樣書）',level:'REQUIRED',received:false},
      {id:'M2',name:'書封與作者照片',level:'SUGGESTED',received:false},
      {id:'M3',name:'新聞稿／書籍介紹',level:'SUGGESTED',received:false}
    ],
    closed:false,
    trail:[],
    unmasked:false
  };
}
resetDemo();

var PHASE='landing';                 /* landing → entry → run → final */
var STAGE=0;                         /* 0..7 共 8 個階段 */
var MSG=null;
var TOTAL=8;

/* ─────────── DOM ─────────── */
function el(t,x,c){var e=document.createElement(t);
  if(x!==null&&x!==undefined&&x!=='')e.textContent=x; if(c)e.className=c; return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function btn(l,c,f){var b=el('button',l,c); b.type='button'; b.onclick=f; return b;}
function chip(t,c){return el('span',t,'chip '+(c||''));}
function stamp(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function trail(w){DEMO.trail.unshift({at:stamp(),who:DEMO.owner||'我',what:w});}
function say(kind,title,detail,list){
  var m=el('div',null,'msg '+kind);
  m.appendChild(el('div',title,'t'));
  if(detail)m.appendChild(el('div',detail,'d'));
  if(list&&list.length){var ul=document.createElement('ul');
    list.forEach(function(x){ul.appendChild(el('li',x));}); m.appendChild(ul);}
  MSG=m; render();
}
function rec(title,pairs){
  var w=el('div',null,'rec');
  w.appendChild(el('div',title,'rh'));
  var dl=document.createElement('dl');
  pairs.forEach(function(p){
    dl.appendChild(el('dt',p[0]));
    var dd=document.createElement('dd');
    if(typeof p[1]==='string'||typeof p[1]==='number') dd.textContent=(p[1]===''?'—':String(p[1]));
    else if(p[1]) dd.appendChild(p[1]);
    dl.appendChild(dd);
  });
  w.appendChild(dl); return w;
}
function fld(id,label,node){
  var l=el('label',label,'fld'); l.setAttribute('for',id); node.id=id;
  var d=document.createElement('div'); d.appendChild(l); d.appendChild(node); return d;
}
function sel(opts){var s=document.createElement('select');
  opts.forEach(function(o){var op=document.createElement('option');
    op.value=o[0]; op.textContent=o[1]; s.appendChild(op);}); return s;}

/* ═══════════════ 八個業務階段 ═══════════════ */
var STAGES=[
{
  key:'intake', name:'建立需求與指定承辦',
  basis:['現行系統已具備：登記需求、遮罩聯絡方式',
         '第二階段提案：明確顯示承辦人、並讓需求方收到「已接手」通知'],
  intro:function(){
    return [STORY.author+'剛出版'+STORY.book+'。'+STORY.publisher+'的編輯'+STORY.editor
            +'把資料寄給了公司，現在由你接手這件事。',
            '資料都已經幫你填好了，你只要確認內容、按下接手。'];
  },
  ask:'請確認下面的需求內容，然後按「建立需求並由我接手」。',
  body:function(host){
    var contactNode=document.createElement('span');
    if(DEMO.unmasked){
      contactNode.appendChild(el('span',STORY.contact));
      contactNode.appendChild(document.createTextNode(' '));
      contactNode.appendChild(btn('重新隱藏','link',function(){
        DEMO.unmasked=false; MSG=null; render(); }));
      contactNode.appendChild(el('div','已留下查閱紀錄','note'));
    } else if(DEMO.handedOver){
      contactNode.appendChild(el('span','***','mask'));
      contactNode.appendChild(document.createTextNode(' '));
      contactNode.appendChild(btn('查看','link',function(){
        DEMO.unmasked=true; trail('查看了需求方的聯絡方式');
        say('ok','已經看到聯絡方式了','這次查看留下了紀錄。換頁或重新載入之後會自動遮回去。'); }));
    } else {
      contactNode.appendChild(el('span','***','mask'));
      contactNode.appendChild(el('div','接手之後才看得到','note'));
    }
    host.appendChild(rec('需求內容（已幫你填好）',[
      ['作者',STORY.author],
      ['書名',STORY.book],
      ['出版社',STORY.publisher],
      ['需求方聯絡方式',contactNode],
      ['希望檔期',DEMO.request.window],
      ['需求方偏好的節目',STORY.prefer+'（僅供評估，不代表保證安排）'],
      ['目前狀態',DEMO.handedOver?'已接手，處理中':'尚未建立']
    ]));
    if(DEMO.handedOver){
      host.appendChild(rec('承辦',[
        ['承辦人',DEMO.owner],
        ['需求方會收到',
         '「您的訪談需求已由 '+DEMO.owner+' 接手，我們會在確認方向後與您聯繫。」']
      ]));
    }
  },
  primary:function(){
    if(DEMO.handedOver) return null;
    return btn('建立需求並由我接手','act go',function(){
      DEMO.handedOver=true; DEMO.owner=STORY.owner; DEMO.request.status='已接手，處理中';
      trail('建立需求並接手'); trail('系統通知需求方：已接手，處理中');
      say('ok','已接手，需求方會收到處理中通知','承辦人是 '+DEMO.owner+'。');
    });
  },
  done:function(){ return DEMO.handedOver; }
},
{
  key:'recommend', name:'推薦適合的節目',
  basis:['現行系統已具備：把節目一個一個加進來，各自跑各自的進度',
         '第二階段提案（依 Ivy 回饋）：改成可挑選的清單，並附推薦原因與是否可能需要宣傳費'],
  intro:function(){
    return ['節目是由你來推薦的，不是讓作者許願——因為作者指定的節目常常要付宣傳費。',
            '下面是可以挑的節目。每一個都寫了為什麼推薦，以及會不會牽涉到費用。'];
  },
  ask:'請挑至少兩個節目加入推薦，然後按「加入推薦節目」。',
  body:function(host){
    DEMO.programs.forEach(function(p){
      var picked=DEMO.picked.indexOf(p.id)>=0;
      var b=el('button',null,'opt'); b.type='button';
      b.setAttribute('aria-pressed',String(picked));
      b.appendChild(el('div',p.name+'　'+p.topic,'on'));
      b.appendChild(el('div','推薦原因：'+p.reason,'oc'));

function closureChecks(){
  var rows=DEMO.programs.filter(function(p){return DEMO.picked.indexOf(p.id)>=0;});
  var acc=rows.filter(function(p){return DEMO.replies[p.id]==='ACCEPT';});
  var need=DEMO.materials.filter(function(m){return m.level==='REQUIRED';});
  var got=need.filter(function(m){return m.received;});
  return [
    {label:'需求方確認過推薦名單',pass:DEMO.shortlistSent,
     detail:DEMO.shortlistSent?'已寄出確認':'還沒寄出推薦節目清單'},
    {label:'邀約結果已確定',pass:acc.length>0,
     detail:acc.length?('已接受：'+acc.map(function(p){return p.name;}).join('、')):'還沒有節目接受'},
    {label:'費用或例外已處理',pass:DEMO.approval.done,
     detail:DEMO.approval.done?(DEMO.approval.needed?'主管已確認':'不需要審核'):'還沒處理'},
    {label:'訪談時間已確認',pass:!!DEMO.confirmedTime,
     detail:DEMO.confirmedTime||'還沒確認時間'},
    {label:'錄音與上架結果已確定',pass:DEMO.production==='PUBLISHED',
     detail:DEMO.production==='PUBLISHED'?'已上架':'製作還沒完成'},
    {label:'本案必要素材已收齊',pass:need.length>0&&got.length===need.length,
     detail:need.length? (got.length===need.length?'已收齊':'還有 '+(need.length-got.length)+' 項沒收到')
                       :'目前沒有標成本案必要的素材'}
  ];
}

function toMd(){
  var d=fbLoad(), o='# 新書訪談邀約 · 情境操作體驗回饋\n\n';
  var keys=STAGES.map(function(s){return s.key;});
  var any=keys.filter(function(k){return d.notes&&d.notes[k];});
  o+=(d.final?'狀態：已完成全部 '+TOTAL+' 個階段\n\n':'狀態：⚠️ 尚未完成全部階段（以下為草稿）\n\n');
  if(d.final){
    o+='## 最後四題\n\n';
    o+='- 時間：'+d.final.at+(d.final.who?'　填寫者：'+d.final.who:'')+'\n';
    o+='- 整體流程是否符合實際工作：'+(d.final.q1||'')+'\n';
    o+='- 哪一步最容易卡住：'+(d.final.q2||'')+'\n';
    if(d.final.q3) o+='- 還缺少什麼資料或動作：'+d.final.q3+'\n';
    if(d.final.q4) o+='- 哪些名稱或說明看不懂：'+d.final.q4+'\n';
    o+='\n';
  }
  o+='## 每一步的意見\n\n';
  if(!any.length) o+='（沒有填寫）\n';
  else keys.forEach(function(k){
    var n=d.notes[k]; if(!n) return;
    o+='### '+n.stage+'\n\n- 時間：'+n.at+'\n- 看不懂的地方：'+n.text+'\n\n';
  });
  return o;
}
function download(name,mime,text){
  try{
    var blob=new Blob(['﻿'+text],{type:mime+';charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  }catch(e){ alert('這個瀏覽器擋住了下載。內容已經顯示在下面，請自行全選複製。'); }
}
function showOut(t){
  var n=document.getElementById('fbout'); if(!n) return; clear(n);
  if(!t) return;
  var p=el('div',t,'out'); p.setAttribute('tabindex','0'); n.appendChild(p);
  p.scrollIntoView({block:'nearest'});
}

function doReset(){
  var d=fbLoad();
  var n=(d.notes?Object.keys(d.notes).length:0)+(d.final?1:0);
  var wipe=false;
  if(n>0) wipe=confirm('要一起清掉你填的回饋嗎？\n\n'
    +'按「確定」＝連回饋一起清掉（無法復原，建議先下載）。\n按「取消」＝只重置，回饋保留。');
  resetDemo();
  PHASE='landing'; STAGE=0; MSG=null;
  try{ ['book_interview_demo_state','book_interview_ui_demo'].forEach(function(k){
    localStorage.removeItem(k); }); }catch(e){}
  if(wipe){ try{ localStorage.removeItem(FB_KEY); }catch(e){} }
  render();
}

function render(){

    [['這次的作者',STORY.author],
     ['這次的新書',STORY.book+'（'+STORY.publisher+'）'],

    h.appendChild(dl);
    st.appendChild(h);
    var bar=el('div',null,'actions');
    bar.appendChild(btn('開始情境測試','act go',function(){
      PHASE='entry'; MSG=null; render(); focusTop(); }));
    st.appendChild(bar);
    return;
  }

  if(PHASE==='entry'){
    lede.textContent='請選擇你要進入的功能。';
    st.appendChild(el('h2','入口情境示意'));
    st.appendChild(el('p','此頁為公司功能入口示意。','note'));
    var t=el('button',null,'tile'); t.type='button';
    t.appendChild(el('div','新書訪談邀約','tn'));
    t.appendChild(el('div','替新書作者建立訪談需求、推薦適合的節目，並追蹤邀約與訪談進度。','td'));
    t.appendChild(el('div','點這裡進入 →','tgo'));
    t.onclick=function(){ PHASE='run'; STAGE=0; MSG=null; render(); focusTop(); };
    st.appendChild(t);
    st.appendChild(el('p','這次試用只開這一個入口。這一頁只是示意，⛔ 還沒有跟公司其他系統串接。','note'));
    return;
  }

  if(PHASE==='final'){ lede.textContent='你是公司內部負責新書宣傳與訪談邀約的企劃。';
    renderFinal(st); return; }

  /* ── run ── */
  lede.textContent='你是公司內部負責新書宣傳與訪談邀約的企劃。';
  var s=STAGES[STAGE];

  var pr=el('div',null,'prog');
  pr.appendChild(el('span','第 '+(STAGE+1)+' ／ '+TOTAL+' 階段','n'));
  var bar0=el('div',null,'bar');
  var fill=document.createElement('i');
  fill.style.width=Math.round((STAGE+1)/TOTAL*100)+'%';
  bar0.appendChild(fill); pr.appendChild(bar0);
  pr.appendChild(el('span',s.name,'n'));
  st.appendChild(pr);

  var task=el('div',null,'task');
  task.appendChild(el('h2',s.name));
  var why=el('div',null,'why');
  why.appendChild(chip('現行系統已具備','now'));
  why.appendChild(document.createTextNode(' '));
  why.appendChild(chip('第二階段提案','prop'));
  task.appendChild(why);
  (typeof s.intro==='function'?s.intro():s.intro).forEach(function(p){ task.appendChild(el('p',p)); });
  task.appendChild(el('div',typeof s.ask==='function'?s.ask():s.ask,'ask'));
  st.appendChild(task);

  if(MSG) st.appendChild(MSG);

  var bodyBox=document.createElement('div');
  s.body(bodyBox);
  st.appendChild(bodyBox);

  var p=s.primary();
  var actions=el('div',null,'actions');
  if(p) actions.appendChild(p);
  if(s.done()){
    if(STAGE<TOTAL-1) actions.appendChild(btn('下一階段 →','act'+(p?'':' go'),function(){
      STAGE++; DEMO.unmasked=false; MSG=null; render(); focusTop(); }));
    else actions.appendChild(btn('前往最後四題 →','act go',function(){
      PHASE='final'; MSG=null; render(); focusTop(); }));
  }
  if(STAGE>0) actions.appendChild(btn('← 上一階段','act small',function(){
    STAGE--; DEMO.unmasked=false; MSG=null; render(); focusTop(); }));
  actions.appendChild(btn('重新開始','act small',doReset));
  st.appendChild(actions);

  stepNote(st);
}
