<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>新書訪談邀約｜情境操作體驗</title>
<style>
/* ══════════════════════════════════════════════════════════════
   ⭐ 版面回到實機那一版：頂端四個入口的導覽列、細線分隔、少色塊。
      色彩與字體逐項對齊 DESIGN.md Report 模式。
   ⭐ 所有看得到的字 ≥13px、輸入欄 ≥16px，全部走 token。
   ⛔ 無外部資源、⛔ 無卡片陰影、⛔ 無圓角、⛔ 無裝飾性元件。
   ══════════════════════════════════════════════════════════════ */
:root{
  color-scheme: light;
  --bg:#ECE6DB; --card:#F5F1E8; --ink:#1A1A1A;
  --body:#5A5A5A; --taupe:#7A736A; --line:#B8B0A4;
  --accent:#B5451F;
  --serif:'Noto Serif TC','Songti TC',Georgia,'Times New Roman',serif;
  --sans:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  --font-xs:13px; --font-sm:14px; --font-base:15px; --font-md:16px;
  --font-lg:18px; --font-xl:22px; --font-display:28px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--serif);font-size:var(--font-base);line-height:1.8}

.banner{position:sticky;top:0;z-index:50;background:var(--accent);color:#FFF8F2;
  font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.06em;
  padding:9px 16px;text-align:center}
.banner b{font-weight:600}
.disclose{margin:0;padding:10px 16px;text-align:center;
  border-bottom:1px solid var(--line);font-family:var(--sans);
  font-size:var(--font-xs);color:var(--body)}

.wrap{max-width:860px;margin:0 auto;padding:26px 20px 96px}
#stage{scroll-margin-top:60px}

.eyebrow{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.2em;
  color:var(--taupe);margin:0}
h1{font-size:var(--font-display);font-weight:700;margin:6px 0 4px;
  line-height:1.35;text-wrap:balance}
h2{font-size:var(--font-lg);font-weight:700;margin:26px 0 10px;text-wrap:balance}
h3{font-family:var(--sans);font-size:var(--font-xs);font-weight:600;letter-spacing:.1em;
  color:var(--taupe);margin:24px 0 8px}
.sub{font-size:var(--font-md);color:var(--body);margin:0 0 22px}
.rule{border:0;border-top:1px solid var(--line);margin:22px 0}
p{margin:0 0 10px}

/* ── 頂端四個入口（逐項對齊實機）── */
nav{display:flex;flex-wrap:wrap;gap:18px;margin:0 0 6px;
  font-family:var(--sans);font-size:var(--font-xs)}
nav button{background:none;border:0;padding:0 0 3px;cursor:pointer;
  font:inherit;color:var(--body);border-bottom:1px solid transparent}
nav button:hover,nav button:focus-visible{color:var(--ink);border-bottom-color:var(--line)}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.navrule{border:0;border-top:1px solid var(--line);margin:0 0 20px}

/* ── 開場／前情提要：細線，⛔ 不用色塊 ── */
.brief{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:22px 0;margin:0 0 20px}
.brief h2{font-size:var(--font-xl);margin:0 0 12px}
.brief p{font-size:var(--font-md);margin:0 0 10px}
.brief dl{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 22px}
.brief dt{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);padding-top:3px}
.brief dd{margin:0;font-size:var(--font-base)}

.tile{display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  border:0;border-top:1px solid var(--line);background:none;padding:18px 0}
.tile:last-of-type{border-bottom:1px solid var(--line)}
.tile:hover .tn,.tile:focus-visible .tn{color:var(--accent)}
.tile .tn{font-size:var(--font-lg);font-weight:700;margin:0 0 6px}
.tile .td{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);margin:0}
.tile .tgo{font-family:var(--sans);font-size:var(--font-xs);color:var(--accent);margin:8px 0 0}
.tile .tdone{font-family:var(--sans);font-size:var(--font-xs);color:var(--ink);margin:8px 0 0}

/* ── 進度與階段標題 ── */
.prog{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.prog .n{font-family:var(--sans);font-size:var(--font-xs);letter-spacing:.1em;color:var(--taupe)}
.prog .bar{flex:1;min-width:110px;height:2px;background:var(--line);position:relative}
.prog .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);display:block}

.task{border-bottom:1px solid var(--line);padding:0 0 18px;margin:0 0 20px}
.task h2{font-size:var(--font-xl);margin:0 0 6px}
.task .why{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);margin:0 0 12px}
.task p{font-size:var(--font-md);margin:0 0 10px}
.task .ask{margin:14px 0 0;font-family:var(--sans);font-size:var(--font-md);
  color:var(--ink);font-weight:600}

/* ── 資料區：只有細線，⛔ 不包框 ── */
.rec{margin:0 0 20px}
.rec .rl{font-family:var(--sans);font-size:var(--font-xs);font-weight:600;letter-spacing:.1em;
  color:var(--taupe);padding:0 0 8px;border-bottom:1px solid var(--line);margin:0 0 12px}
.rec dl{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;margin:0}
.rec dt{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);padding-top:3px}
.rec dd{margin:0;font-size:var(--font-base)}

/* ── 逐節目區塊 ── */
.ep{border-top:1px solid var(--line);padding:18px 0 4px;margin:0}
.ep:last-of-type{border-bottom:1px solid var(--line);margin:0 0 16px}
.ep .en{font-size:var(--font-md);font-weight:700;margin:0 0 8px}
.ep .es{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}

/* ── 可選項目（是按鈕，保留邊框當可點提示）── */
.opt{display:block;width:100%;text-align:left;font-family:inherit;color:inherit;cursor:pointer;
  border:1px solid var(--line);background:none;padding:13px 15px;margin:0 0 8px}
.opt:hover,.opt:focus-visible{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--accent)}
.opt .on{font-size:var(--font-md);font-weight:700;margin:0 0 4px}
.opt .oc{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);margin:0 0 6px}
.opt .of{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);margin:0}
.opt .pick{font-family:var(--sans);font-size:var(--font-xs);color:var(--accent);
  margin:8px 0 0;font-weight:600}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 0;align-items:center}
button.act{font-family:var(--sans);font-size:var(--font-md);padding:11px 20px;cursor:pointer;
  background:none;border:1px solid var(--line);color:var(--ink)}
button.act:hover,button.act:focus-visible{border-color:var(--ink)}
button.act.go{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:600}
button.act.small{font-size:var(--font-sm);padding:7px 13px}
button.act:disabled{opacity:.45;cursor:not-allowed}
button.link{background:none;border:0;padding:0;cursor:pointer;font-family:var(--sans);
  font-size:var(--font-sm);color:var(--accent);text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

label.fld{display:block;font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);
  margin:14px 0 4px}
input[type=text],select,textarea{width:100%;font-family:var(--sans);font-size:var(--font-md);
  padding:9px 11px;border:1px solid var(--line);background:#FFFDF9;color:var(--ink)}
textarea{min-height:68px;resize:vertical}
.chkline{display:flex;gap:10px;align-items:flex-start;margin:12px 0 0;
  font-family:var(--sans);font-size:var(--font-md)}
.chkline input{width:18px;height:18px;flex:none;margin-top:5px;font-size:var(--font-md)}
.chkline label{margin:0;color:var(--ink);font-size:var(--font-md)}

.msg{font-family:var(--sans);font-size:var(--font-sm);padding:12px 15px;margin:14px 0;
  border:1px solid var(--line)}
.msg.ok{border-color:var(--ink)}
.msg.bad{border-color:var(--accent);color:var(--accent)}
.msg .t{font-weight:600}
.msg .d{color:var(--body);margin-top:3px}
.msg.bad .d{color:var(--accent)}
.msg ul{margin:8px 0 0;padding-left:20px}

.note{font-family:var(--sans);font-size:var(--font-sm);color:var(--taupe);margin:10px 0 14px}
.mask{font-family:var(--sans);letter-spacing:.14em;color:var(--taupe)}

.figs{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin:0 0 20px}
.fig{flex:1;min-width:150px;padding:14px 18px 14px 0}
.fig .n{font-family:Georgia,'Songti TC',serif;font-size:var(--font-xl);color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.3}
.fig .l{font-family:var(--sans);font-size:var(--font-xs);color:var(--taupe);margin-top:2px}

.tablewrap{overflow-x:auto;margin:0 0 12px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:var(--font-sm);
  font-variant-numeric:tabular-nums;min-width:460px}
th{font-family:var(--sans);font-size:var(--font-xs);font-weight:600;letter-spacing:.08em;
  color:var(--taupe);text-align:left;padding:10px 11px 9px;
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px;border-bottom:1px solid rgba(184,176,164,.45);vertical-align:top}
tr:last-child td{border-bottom:0}

.chip{display:inline-block;font-family:var(--sans);font-size:var(--font-xs);
  padding:2px 8px;border:1px solid var(--line);color:var(--body);white-space:nowrap}
.chip.now{border-color:var(--ink);color:var(--ink)}
.chip.prop{border-color:var(--accent);color:var(--accent)}
.chip.ok{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip.wait{border-style:dashed;color:var(--taupe)}

.book{border-top:1px solid var(--line);padding:18px 0}
.book:last-of-type{border-bottom:1px solid var(--line);margin:0 0 16px}
.book .bt{font-size:var(--font-md);font-weight:700;margin:0 0 4px}
.book .bm{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);margin:0 0 8px}
.book .bs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}

.matline{display:flex;flex-wrap:wrap;gap:9px;align-items:center;
  padding:9px 0;border-bottom:1px solid rgba(184,176,164,.45);font-size:var(--font-sm)}
.matline .mn{flex:1;min-width:140px}

.stepnote{border-top:1px solid var(--line);margin:24px 0 0;padding:16px 0 0}
.stepnote label{font-family:var(--sans);font-size:var(--font-sm);color:var(--body);
  display:block;margin:0 0 6px}
.saved{font-family:var(--sans);font-size:var(--font-xs);color:var(--accent);margin:8px 0 0}

.final{border-top:1px solid var(--line);padding:20px 0 0;margin:0 0 18px}
.final .row{margin:0 0 16px}
.fbnote{font-family:var(--sans);font-size:var(--font-sm);color:var(--accent);
  margin:14px 0 0;font-weight:600}
.out{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:var(--font-xs);
  background:#FFFDF9;border:1px solid var(--line);padding:14px;max-height:260px;
  overflow:auto;margin:14px 0 0;line-height:1.6}

details.notes{border-top:1px solid var(--line);margin:30px 0 0;padding:18px 0 0}
details.notes summary{font-family:var(--sans);font-size:var(--font-sm);color:var(--taupe);
  cursor:pointer;list-style:none}
details.notes summary::-webkit-details-marker{display:none}
details.notes summary::before{content:'▸ ';color:var(--line)}
details.notes[open] summary::before{content:'▾ '}
details.notes .inner{margin:16px 0 0;font-family:var(--sans);font-size:var(--font-sm);color:var(--body)}
details.notes .inner h4{font-size:var(--font-sm);font-weight:600;color:var(--ink);margin:18px 0 6px}
details.notes .inner ul{margin:0 0 10px;padding-left:20px}
details.notes .inner li{margin:0 0 4px}
details.notes .inner table{min-width:520px;font-size:var(--font-xs)}

@media (max-width:640px){
  .wrap{padding:20px 15px 88px}
  h1{font-size:var(--font-xl)}
  .brief dl,.rec dl{grid-template-columns:1fr;gap:2px 0}
  .brief dd,.rec dd{margin:0 0 10px}
  button.act{width:100%}
  .actions{gap:8px}
  nav{gap:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="banner">互動示意稿｜<b>全部為假資料</b>｜不連資料庫</div>
<p class="disclose">本案例中的人物、書名、出版社、節目與聯絡資料全部為虛構。</p>

<div class="wrap">
  <p class="eyebrow">SDH</p>
  <h1>新書訪談邀約｜情境操作體驗</h1>
  <p class="sub" id="lede"></p>
  <hr class="rule">
  <div id="stage"></div>
  <details class="notes" id="notes">
    <summary>設計與驗證備註（給專案負責人看的技術細節，同事可以略過）</summary>
    <div class="inner" id="notesinner"></div>
  </details>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   ⛔ 完全沒有對外呼叫：沒有遠端請求、沒有長連線、沒有 CDN、沒有外部字型。
   ⛔ 不連任何資料庫。狀態只在 DEMO 這個記憶體物件裡。
   ⭐ 只有回饋會寫瀏覽器本機儲存，且永不上傳。
   ⭐ 一律 textContent，⛔ 不用 innerHTML。
   ⚠️ 表單值一律放狀態，⛔ 不要放 DOM——重繪會把 DOM 上的值洗掉（已踩過三次）。
   ══════════════════════════════════════════════════════════════ */

var STORY={
  author:'林以安老師', book:'《在變動裡，找到自己的節奏》',
  publisher:'遠方學堂出版（虛構）', contact:'yian.lin@example.invalid',
  editor:'蔡宜蓁', owner:'Ivy（總經紀人）',
  interviewWindow:'2026 年 11 月中到 12 月初',
  airWindow:'2026 年 12 月 5 日前（配合新書上市）',
  pubMonth:'2026-12', topic:'自我成長',
  summary:'寫給在變動裡失去節奏的人。作者用二十年的觀察，談怎麼在不確定裡重新找回自己的步調。'
};
var FEE_LABEL={NONE:'不需要宣傳費',MAYBE:'可能需要宣傳費（待確認）',YES:'需要宣傳費'};
var BOOK_STATUS={PLANNING:'籌備中',CONFIRMED:'已確認上市日',DELAYED:'上市延後',CANCELLED:'不出版了'};
var DEP_LEVEL={INTEREST:{label:'表達訪問意願',depth:1},REQUESTED:{label:'已轉成訪談需求',depth:2},
  SCHEDULED:{label:'已排定訪談時間',depth:3},RECORDED:{label:'已經錄音',depth:4}};
var HANDOFF={PENDING:'待處理',ACKNOWLEDGED:'對方已收到',IN_PROGRESS:'處理中',FULFILLED:'已完成'};
var PROD={NOT_STARTED:'還沒開始',RECORDED:'已錄音',EDITED:'已剪輯',
  OUTSOURCED:'外包剪輯中',AWAITING:'等節目方上架',PUBLISHED:'已上架'};
var ALT_TIME='__ALT__';

function programSeed(){
  return [
    {id:'P1',name:'《慢慢說》',topic:'教育・親子',
     reason:'聽眾與本書讀者重疊高，主持人長期關注教育現場',fee:'NONE',amount:''},
    {id:'P2',name:'《上班的事》',topic:'職場',
     reason:'職場轉換的主題貼近本書第三章',fee:'NONE',amount:''},
    {id:'P3',name:'《午後書桌》',topic:'文學・閱讀',
     reason:'專做新書專訪，製作品質穩定',fee:'MAYBE',amount:''},
    {id:'P4',name:'《週三讀什麼》',topic:'閱讀',
     reason:'過去合作過兩次，回覆速度快',fee:'NONE',amount:''},
    {id:'P5',name:'《城市晚讀》',topic:'生活',
     reason:'觸及數大，但主題比較泛，未必聚焦這本書',fee:'YES',amount:'15,000'}
  ];
}
function bookSeed(){
  return [
    {id:'BK-DEMO-002',title:'《風的名字》',author:'陳予恩老師',publisher:'見山出版（虛構）',
     pubMonth:'2026-11',topic:'文學',status:'CONFIRMED',summary:'一本關於離開與回來的散文集。',
     interview:'2026 年 10 月下旬',air:'2026 年 11 月 10 日前',
     deps:[{who:'《午後書桌》',level:'INTEREST'}]},
    {id:'BK-DEMO-003',title:'《把日子過成句子》',author:'何知微老師',publisher:'小徑文化（虛構）',
     pubMonth:'2027-01',topic:'自我成長',status:'PLANNING',summary:'用寫字重新整理生活的練習。',
     interview:'2026 年 12 月',air:'2027 年 1 月中',deps:[]},
    {id:'BK-DEMO-004',title:'《我們與噪音的距離》',author:'邱楷書老師',publisher:'遠方學堂出版（虛構）',
     pubMonth:'2026-12',topic:'心理',status:'PLANNING',summary:'談城市生活裡的聽覺疲勞。',
     interview:'2026 年 11 月',air:'2026 年 12 月中',deps:[{who:'《慢慢說》',level:'REQUESTED'}]}
  ];
}
function materialSeed(){
  return [{id:'M1',name:'公關書（實體樣書）',level:'REQUIRED',received:false},
          {id:'M2',name:'書封與作者照片',level:'SUGGESTED',received:false},
          {id:'M3',name:'新聞稿／書籍介紹',level:'SUGGESTED',received:false}];
}

/* ─────────── 狀態 ─────────── */
var DEMO;
function resetDemo(){
  DEMO={
    handedOver:false, owner:'',
    request:{interview:STORY.interviewWindow, air:STORY.airWindow, from:''},
    wish:[],
    programs:programSeed(), picked:[],
    approval:{needed:false,done:false,why:''},
    listSent:false, theirConfirm:false,
    replies:{}, episodes:[],
    closed:false, trail:[], unmasked:false,
    books:bookSeed(), myBook:null,
    bookDraft:{title:'',author:'',pub:'',month:'',interview:'',air:'',summary:''},
    changeKind:'', changeDetail:'', notified:false,
    doneTracks:{}
  };
}
resetDemo();

var PHASE='landing';
var TRACK='', STAGE=0, MSG=null, PEEK='';

/* ─────────── DOM ─────────── */
function el(t,x,c){var e=document.createElement(t);
  if(x!==null&&x!==undefined&&x!=='')e.textContent=x; if(c)e.className=c; return e;}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);}
function btn(l,c,f){var b=el('button',l,c); b.type='button'; b.onclick=f; return b;}
function chip(t,c){return el('span',t,'chip '+(c||''));}
function stamp(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function trail(w){DEMO.trail.unshift({at:stamp(),who:DEMO.owner||'我',what:w});}
function say(kind,title,detail,list){
  var m=el('div',null,'msg '+kind);
  m.appendChild(el('div',title,'t'));
  if(detail)m.appendChild(el('div',detail,'d'));
  if(list&&list.length){var ul=document.createElement('ul');
    list.forEach(function(x){ul.appendChild(el('li',x));}); m.appendChild(ul);}
  MSG=m; render();
}
function rec(label,pairs){
  var w=el('div',null,'rec');
  w.appendChild(el('div',label,'rl'));
  var dl=document.createElement('dl');
  pairs.forEach(function(p){
    dl.appendChild(el('dt',p[0]));
    var dd=document.createElement('dd');
    if(typeof p[1]==='string'||typeof p[1]==='number') dd.textContent=(p[1]===''?'—':String(p[1]));
    else if(p[1]) dd.appendChild(p[1]);
    dl.appendChild(dd);
  });
  w.appendChild(dl); return w;
}
function fld(id,label,node){
  var l=el('label',label,'fld'); l.setAttribute('for',id); node.id=id;
  var d=document.createElement('div'); d.appendChild(l); d.appendChild(node); return d;
}

function tbl(cols,rows,host){
  var w=el('div',null,'tablewrap'), t=document.createElement('table');
  var th=document.createElement('thead'), hr=document.createElement('tr');
  cols.forEach(function(c){hr.appendChild(el('th',c));});
  th.appendChild(hr); t.appendChild(th);
  var tb=document.createElement('tbody');
  rows.forEach(function(r){
    var tr=document.createElement('tr');
    r.forEach(function(cell){
      var td=document.createElement('td');
      if(typeof cell==='string'||typeof cell==='number') td.textContent=String(cell);
      else if(cell) td.appendChild(cell);
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
  t.appendChild(tb); w.appendChild(t); if(host) host.appendChild(w); return w;
}

function closureChecks(){
  var eps=DEMO.episodes;
  var noTime=eps.filter(function(e){return e.confirmed===ALT_TIME||!e.confirmed;});
  var notPub=eps.filter(function(e){return e.production!=='PUBLISHED';});
  var missMat=[]; eps.forEach(function(e){
    e.materials.filter(function(m){return m.level==='REQUIRED'&&!m.received;})
      .forEach(function(m){ missMat.push(e.name+'的'+m.name); }); });
  var outstanding=eps.filter(function(e){
    return e.producer==='COMPANY'&&e.inHouse===false&&e.hoStatus!=='FULFILLED'; });
  var c=[
    {label:'雙方都確認過節目名單',pass:DEMO.listSent&&DEMO.theirConfirm,
     detail:DEMO.listSent?(DEMO.theirConfirm?'兩邊都確認了':'還在等對方回覆'):'還沒寄出名單'},
    {label:'邀約結果已確定',pass:eps.length>0,
     detail:eps.length?('接受的有 '+eps.map(function(e){return e.name;}).join('、')):'還沒有節目接受'},
    {label:'費用或例外已處理',pass:DEMO.approval.done,
     detail:DEMO.approval.done?(DEMO.approval.needed?'主管已確認':'不需要審核'):'還沒處理'},
    {label:'每一集的訪談時間都定案',pass:eps.length>0&&!noTime.length,
     detail:noTime.length?(noTime.map(function(e){return e.name;}).join('、')+' 還在另外確認時間')
       :'都定好了'},
    {label:'每一集都已上架或不予上架',pass:eps.length>0&&!notPub.length,
     detail:notPub.length?(notPub.map(function(e){return e.name+'（'+PROD[e.production]+'）';}).join('、'))
       :'都上架了'},
    {label:'每一集的必要素材都收齊',pass:eps.length>0&&!missMat.length,
     detail:missMat.length?('還缺：'+missMat.join('、')):'都收齊了'}
  ];
  if(eps.some(function(e){return e.producer==='COMPANY'&&e.inHouse===false;}))
    c.splice(5,0,{label:'外包剪輯都已完成',pass:!outstanding.length,
      detail:outstanding.length?(outstanding.map(function(e){
        return e.name+'（'+(e.hoMade?HANDOFF[e.hoStatus]:'還沒建交辦單')+'）'; }).join('、'))
        :'外包的都完成了'});
  return c;
}

function toMd(){
  var d=fbLoad(), o='# 新書訪談邀約 · 情境操作體驗回饋\n\n';

  if(d.final){
    o+='## 最後四題\n\n- 時間：'+d.final.at+(d.final.who?'　填寫者：'+d.final.who:'')+'\n';
    o+='- 整體流程是否符合實際工作：'+(d.final.q1||'')+'\n';
    o+='- 哪一步最容易卡住：'+(d.final.q2||'')+'\n';
    if(d.final.q3) o+='- 還缺少什麼資料或動作：'+d.final.q3+'\n';
    if(d.final.q4) o+='- 哪些名稱或說明看不懂：'+d.final.q4+'\n';
    o+='\n';
  }
  o+='## 每一步的意見\n\n';
  var ks=Object.keys(d.notes||{});
  if(!ks.length) o+='（沒有填寫）\n';
  else ks.forEach(function(k){ var n=d.notes[k];
    o+='### '+n.stage+'\n\n- 時間：'+n.at+'\n- 看不懂的地方：'+n.text+'\n\n'; });
  return o;
}
function download(name,mime,text){
  try{
    var blob=new Blob(['﻿'+text],{type:mime+';charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); },1000);
  }catch(e){ alert('這個瀏覽器擋住了下載。內容已經顯示在下面，請自行全選複製。'); }
}

    }
  }
  if(STAGE>0) actions.appendChild(btn('← 上一階段','act small',function(){
    STAGE--; DEMO.unmasked=false; MSG=null; render(); focusTop(); }));
  actions.appendChild(btn('← 回入口','act small',function(){
    PHASE='entry'; TRACK=''; PEEK=''; MSG=null; render(); focusTop(); }));
  actions.appendChild(btn('重新開始','act small',doReset));
  st.appendChild(actions);
  stepNote(st);
}
